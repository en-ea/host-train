        body: `Party of ${p.size}. "We always sit at ${t.name}." Table ${t.name} is ${busy ? 'occupied right now, about ' + Math.round(expectedFreeAt(tid) - SH.clock) + ' min until it frees up' : 'open'}.`,
        options: [{ k: 'yes', label: busy ? `Promise ${t.name} when it opens` : `Seat them at ${t.name}`, primary: true }, { k: 'no', label: 'Offer the best open table instead' }] });
    },
    resolve(m, k) {
      const p = P(m.pid); if (!p) return;
      const tid = p.hidden.wantsTable;
      if (k === 'yes') {
        p.prefTable = tid;
        const i = recordCurve('pref', `Request: ${shortName(p)}`, 'pending', '');
        addGoal('pref', p.id, i, SH.clock + 30, { tid });
        if (tableIsFree(tid)) beginSeat(p.id, [tid]);
      } else {
        recordCurve('pref', `Request: ${shortName(p)}`, p.tags.includes('vip') ? 'poor' : 'ok', 'Turned down a regular/VIP table request.');
        beginSeat(p.id);
      }
    },
  },
  move: {
    create(p, reason) {
      pushMsg({ type: 'move', pid: p.id, icon: 'move', title: `Table ${tNames(p.tableIds)} wants to move`,
        body: `${shortName(p)} (${p.size}): "${reason || RNG.pick(['It is really drafty by the door.', "We're right under the speaker, can't hear each other.", 'Could we get a booth? My back is killing me.', 'The table next to us is very loud.'])}"`,
        options: [{ k: 'move', label: 'Move them', primary: true }, { k: 'comp', label: 'Apologize and send a round, keep them' }, { k: 'no', label: "Sorry, we're full" }] });
    },
    resolve(m, k) {
      const p = P(m.pid); if (!p || p.status !== 'seated') return;
      if (k === 'move') { const i = recordCurve('move', `Move request: ${shortName(p)}`, 'pending'); addGoal('moved', p.id, i, SH.clock + 10, { from: p.tableIds.join() }); beginMove(p.id); }
      else if (k === 'comp') recordCurve('move', `Move request: ${shortName(p)}`, suggestUnits(p, 2).length ? 'ok' : 'good', suggestUnits(p, 2).length ? 'A table was open. Moving them was possible.' : '');
      else recordCurve('move', `Move request: ${shortName(p)}`, 'poor', 'Flat refusal.');
    },
  },
  big: {
    create() {
      const n = RNG.int(8, 12);
      const p = addParty(newParty({ kind: 'walk', name: partyName(RNG), size: n, origSize: n, status: 'new', addedAt: SH.clock, hidden: walkinHidden(RNG, n), flags: { noLeave: false } }));
      p.flags.bigIdx = true;
      const biggest = Math.max(0, ...seatUnits(SH.layout).map(u => u.max));
      pushMsg({ type: 'big', pid: p.id, icon: 'users', title: `Walk-in party of ${n}`, body: `${shortName(p)} just walked in with ${n} people and no reservation. Your biggest table setup seats ${biggest}.`,
        options: [{ k: 'quote', label: 'Quote them a wait', primary: true }, { k: 'seat', label: 'Combine tables and seat now' }, { k: 'turn', label: 'Politely turn them away' }] });
    },
    resolve(m, k) {
      const p = P(m.pid); if (!p) return;
      const biggest = Math.max(0, ...seatUnits(SH.layout).map(u => u.max));
      const possible = biggest >= p.size;
      if (k === 'turn') { recordCurve('big', `Large walk-in: ${shortName(p)}`, possible ? (isRush() ? 'ok' : 'poor') : 'good', possible ? 'You had the tables to fit them.' : "You couldn't fit them anyway."); turnAway(p); }
      else { recordCurve('big', `Large walk-in: ${shortName(p)}`, possible ? 'good' : 'poor', possible ? '' : `No setup in the room seats ${p.size}.`); if (k === 'quote') openQuoteSheet(p.id); else beginSeat(p.id, null, true); }
    },
  },
  camp: {
    create(p) {
      const w = waitingParties().length;
      pushMsg({ type: 'camp', pid: p.id, icon: 'clock', title: `Table ${tNames(p.tableIds)} paid ${Math.round(SH.clock - p.flags.campFrom)} min ago and is still chatting`,
        body: `${shortName(p)} (${p.size}) is lingering. You have ${w} part${w === 1 ? 'y' : 'ies'} waiting.`,
        options: [{ k: 'bar', label: 'Offer them a drink at the bar', primary: true }, { k: 'stay', label: 'Let them linger' }] });
    },
    resolve(m, k) {
      const p = P(m.pid); if (!p || p.status !== 'seated') return;
      if (k === 'bar') { p.hidden.camp = 0; p.phaseEnd = SH.clock + 3; recordCurve('camp', `Campers: ${shortName(p)}`, 'good'); toast(`${shortName(p)} is heading to the bar. Table frees in a few minutes.`); }
      else recordCurve('camp', `Campers: ${shortName(p)}`, waitingParties().length >= 2 ? 'poor' : 'ok', 'Guests were waiting for that table.');
    },
  },
  brk: {
    create(sec) {
      pushMsg({ type: 'brk', sec: sec.id, icon: 'coffee', title: `${sec.server || sec.name} needs a 20-minute break`,
        body: `${sec.name} section has ${sectionLoad()[sec.id].now} covers on the floor right now.`,
        options: [{ k: 'now', label: 'Approve now, skip their section', primary: true }, { k: 'later', label: 'Ask them to wait 15 minutes' }] });
    },
    resolve(m, k) {
      const sec = sectionById(SH.layout, m.sec); if (!sec) return;
      const from = k === 'now' ? SH.clock : SH.clock + 15;
      SH.breaks[m.sec] = { from, until: from + 20 };
      recordCurve('brk', `Break: ${sec.server || sec.name}`, k === 'now' ? 'good' : 'ok', k === 'now' ? '' : 'Delaying breaks wears out servers.');
      toast(`${sec.server || sec.name} on break ${k === 'now' ? 'now' : 'at ' + fmtTime(from)} until ${fmtTime(from + 20)}. Avoid seating ${sec.name}.`);
    },
  },
  kitchen: {
    create() {
      pushMsg({ type: 'kitchen', icon: 'fire', title: 'Kitchen is backed up', body: 'Chef says tickets are running about 15 minutes behind for the next half hour. Tables will turn slower.',
        options: [{ k: 'pad', label: 'Pad my quotes and pace seating', primary: true }, { k: 'keep', label: 'Keep seating as normal' }] });
    },
    resolve(m, k) {
      SH.kitchen = { from: SH.clock, until: SH.clock + 35, factor: 1.4 };
      recordCurve('kitchen', 'Kitchen backed up', k === 'pad' ? 'good' : 'poor', k === 'pad' ? '' : 'Seating hard into a slow kitchen buries servers.');
      if (k === 'pad') SH.kitchen.padded = true;
    },
  },
};

function fireRandomCurveball() {
  const seated = allParties().filter(p => p.status === 'seated');
  const opts = [];
  const cnt = k => SH.cbCount[k] || 0;
  const freshSeated = seated.filter(p => SH.clock - p.seatedAt < 30 && SH.clock - p.seatedAt > 3 && !p.flags.moveAsked);
  if (freshSeated.length) opts.push(['move', 3]);
  if (seated.length && cnt('sizeSeated') < 2) opts.push(['sizeSeated', 1.5]);
  if (cnt('big') < (SH.type === 'friday' || SH.type === 'holiday' ? 2 : 1) && SH.clock > SH.startMin + 45) opts.push(['big', 1.5]);
  if (cnt('brk') < 2 && SH.clock > SH.startMin + 60) opts.push(['brk', 1.5]);
  if (cnt('kitchen') < 1 && occupancy() > 0.5) opts.push(['kitchen', 2]);
  if (!opts.length) return;
  const k = RNG.weighted(opts);
  SH.cbCount[k] = cnt(k) + 1;
  if (k === 'move') { const p = RNG.pick(freshSeated); p.flags.moveAsked = true; CB.move.create(p); }
  else if (k === 'sizeSeated') { const p = RNG.pick(seated); CB.size.create(p, p.size >= 4 && RNG.chance(0.3) ? -1 : RNG.int(1, 2)); }
  else if (k === 'big') CB.big.create();
  else if (k === 'brk') {
    const secs = SH.layout.sections.filter(s => SH.layout.tables.some(t => t.sectionId === s.id) && !SH.breaks[s.id]);
    if (secs.length) CB.brk.create(RNG.pick(secs));
  } else if (k === 'kitchen') CB.kitchen.create();
}

function resolveMsg(id, k) {
  const i = SH.msgs.findIndex(m => m.id === id);
  if (i < 0) return;
  const m = SH.msgs.splice(i, 1)[0];
  try { (CB[m.type] && CB[m.type].resolve) && CB[m.type].resolve(m, k); } catch (e) { console.error(e); }
  if (!SH.msgs.length && SH.pausedForMsg) { SH.pausedForMsg = false; if (!selection) SH.speed = SH.prevSpeed || 1; else SH.resumeAfterSelect = true; }
  tutorialEvent('msg');
  dirty('msg');
}

/* ---------- host actions ---------- */
let selection = null; // {type:'seat'|'move'|'add'|'assign', pid, combine, picked:[]}

function beginSelection(type, pid, preset, combine) {
  const p = P(pid); if (!p) return;
  selection = { type, pid, combine: !!combine, picked: [] };
  closeSheet();
  if (UI.narrow && UI.panelSize !== 'min') { UI.panelBefore = UI.panelSize; setPanelSize('min'); }
  dirty('sel');
  if (preset && preset.length) attemptAction(preset);
}
const beginSeat = (pid, preset, combine) => {
  const p = P(pid);
  if (p && p.kind === 'res' && p.status === 'booked') { checkIn(p, true); }
  beginSelection('seat', pid, preset, combine);
};
const beginMove = pid => beginSelection('move', pid);
const beginAddTable = pid => beginSelection('add', pid);
const beginAssign = pid => beginSelection('assign', pid);

function clearSelection() {
  selection = null;
  if (UI.panelBefore) { setPanelSize(UI.panelBefore); UI.panelBefore = null; }
  if (SH && SH.resumeAfterSelect && !SH.msgs.length) { SH.resumeAfterSelect = false; SH.speed = SH.prevSpeed || 1; }
  dirty('sel');
}

function selectionTap(tid) {
  if (!selection) return;
  const p = P(selection.pid);
  if (!p) { clearSelection(); return; }
  if (selection.combine) {
    const i = selection.picked.indexOf(tid);
    if (i >= 0) selection.picked.splice(i, 1); else selection.picked.push(tid);
    dirty('sel');
    return;
  }
  if (selection.type === 'add') { attemptAction(p.tableIds.concat([tid])); return; }
  attemptAction([tid]);
}

function attemptAction(tids) {
  const p = P(selection.pid);
  const type = selection.type;
  if (type === 'assign') {
    p.assigned = tids.slice();
    const c = capacityOf(SH.layout, tids);
    toast(`${shortName(p)} is now booked on ${tNames(tids)}${p.size > c.max ? ' (too small for ' + p.size + ')' : ''}.`, p.size > c.max ? 'warn' : 'info');
    clearSelection(); return;
  }
  const chk = seatCheck(p, tids, type === 'seat' ? 'seat' : 'move');
  if (chk.block) { toast(chk.block, 'warn'); return; }
  if (type === 'add' || type === 'move') chk.warns = chk.warns.filter(w => w.type !== 'overload' || /break/.test(w.text));
  if (chk.warns.length) { openWarnSheet(p, tids, chk.warns, type); return; }
  commitAction(type, p, tids, []);
}

function commitAction(type, p, tids, warns) {
  SH.stats.warnShown += warns.length;
  for (const w of warns) { SH.stats.overrides.push({ type: w.type, text: w.text, t: SH.clock, party: shortName(p) }); SH.stats.warn[w.type] = (SH.stats.warn[w.type] || 0) + 1; }
  if (type === 'seat') doSeat(p, tids);
  else doMove(p, tids);
  clearSelection();
  saveSoon();
}

function doSeat(p, tids) {
  const now = SH.clock;
  for (const id of tids) { const s = SH.tables[id]; if (s.state === 'clearing') { s.state = 'free'; } }
  const wasSeatedBefore = p.seatedAt != null;
  p.status = 'seated'; p.seatedAt = now; p.tableIds = tids.slice(); p.sectionId = primarySection(tids);
  p.phase = 'seated';
  p.turn = p.hidden.turnOverride || expectedTurn(p.size) * RNG.range(0.88, 1.14);
  p.phaseEnd = now + phaseDur(p, 'seated');
  for (const id of tids) SH.tables[id] = { state: 'occ', pid: p.id, since: now };
  if (!wasSeatedBefore || !SH.stats.seatings.find(x => x.pid === p.id)) SH.stats.seatings.push({ t: now, sec: p.sectionId, pid: p.id });
  toast(`Seated ${shortName(p)} (${p.size}) at ${tNames(tids)}.`, 'good');
  tutorialEvent('seat', p);
  dirty('seat');
}

function doMove(p, tids) {
  const now = SH.clock;
  const old = p.tableIds.slice();
  for (const id of old) if (!tids.includes(id)) SH.tables[id] = { state: now - p.seatedAt > 5 ? 'clearing' : 'free', pid: null, since: now };
  for (const id of tids) { SH.tables[id] = { state: 'occ', pid: p.id, since: SH.tables[id].state === 'occ' ? SH.tables[id].since : now }; }
  p.tableIds = tids.slice(); p.sectionId = primarySection(tids);
  toast(`${shortName(p)} now at ${tNames(tids)}.`, 'good');
  dirty('move');
}

function releaseTable(p, tid) {
  if (p.tableIds.length < 2) return;
  p.tableIds = p.tableIds.filter(x => x !== tid);
  SH.tables[tid] = { state: 'clearing', pid: null, since: SH.clock };
  p.sectionId = primarySection(p.tableIds);
  toast(`Split ${tName(tid)} off from ${shortName(p)}'s party.`);
  dirty('split');
}

function setPhase(p, phase) {
  if (phase === 'clearing') { depart(p); toast(`${shortName(p)} has left. ${tNames(p.tableIds)} needs clearing.`); tutorialEvent('status', phase); return; }
  p.phase = phase; p.phaseEnd = SH.clock + phaseDur(p, phase);
  if (phase !== 'paid') p.flags.campFrom = null;
  tutorialEvent('status', phase);
  dirty('status');
}

function busTable(tid) {
  const s = SH.tables[tid];
  if (!s) return;
  s.state = 'free'; s.pid = null; s.since = SH.clock;
  SH.stats.manualClears++;
  tutorialEvent('bus');
  dirty('bus');
}
function markTableDirty(tid) {
  const s = SH.tables[tid];
  if (s && s.state === 'free') { s.state = 'clearing'; s.since = SH.clock; dirty('bus'); }
}

function unseat(p) {
  for (const id of p.tableIds) SH.tables[id] = { state: 'free', pid: null, since: SH.clock };
  SH.stats.seatings = SH.stats.seatings.filter(x => x.pid !== p.id);
  p.status = p.kind === 'res' ? 'arrived' : 'waiting'; p.seatedAt = null; p.tableIds = []; p.phase = null; p.sectionId = null;
  if (p.kind === 'walk' && p.quote == null) p.quote = 0;
  toast(`${shortName(p)} is back on the ${p.kind === 'res' ? 'reservation' : 'wait'} list.`);
  dirty('unseat');
}

function markNoShow(p, fromMsg) {
  p.status = 'noshow'; p.leftAt = SH.clock;
  if (!fromMsg) {
    p.flags.noshowIdx = recordCurve('late', `No-show: ${shortName(p)}`, p.hidden.noShow ? 'good' : (SH.clock < p.resTime + 10 ? 'poor' : 'ok'), p.hidden.noShow ? '' : 'Marked before they had a chance to show.');
    SH.msgs = SH.msgs.filter(m => m.pid !== p.id);
  }
  toast(`${shortName(p)} marked no-show. ${tNames(p.assigned) || 'Their table'} is released.`);
  dirty('noshow');
}
function cancelParty(p) {
  p.status = 'cancelled'; p.leftAt = SH.clock;
  SH.msgs = SH.msgs.filter(m => m.pid !== p.id);
  toast(`${shortName(p)} removed.`);
  dirty('cancel');
}
function turnAway(p) {
  p.status = 'turned'; p.leftAt = SH.clock;
  toast(`Turned away ${shortName(p)} (${p.size}).`);
  dirty('turn');
}
function checkIn(p, quiet) {
  if (p.status !== 'booked') return;
  p.status = 'arrived'; p.arrivedAt = SH.clock;
  if (!quiet) toast(`${shortName(p)} checked in.`);
  dirty('checkin');
}
function changeSize(p, n) {
  n = clamp(n, 1, 30);
  if (n === p.size) return;
  p.size = n;
  dirty('size');
}

function quoteParty(p, q) {
  p.quote = q; p.quotedAt = SH.clock;
  if (!p.manual && p.hidden.tolerance != null && q > p.hidden.tolerance) {
    p.status = 'declined'; p.leftAt = SH.clock; p.outcome = `Didn't want to wait ${q} min.`;
    toast(`${shortName(p)} (${p.size}) decided not to wait ${q} minutes and left.`, 'bad');
  } else {
    p.status = 'waiting';
    toast(`${shortName(p)} is on the waitlist, quoted ${q} min.`);
  }
  tutorialEvent('quote', p);
  dirty('quote');
}

function addWalkin(o) {
  const p = addParty(newParty({ kind: 'walk', name: o.name || 'Walk-in', size: o.size, origSize: o.size, tags: o.tags || [], note: o.note || '', status: 'new', addedAt: SH.clock, manual: true, hidden: { tolerance: 999, patience: 25 } }));
  if (o.quote != null) quoteParty(p, o.quote);
  dirty('add');
  return p;
}

function autoAssign(size, time) {
  const turn = expectedTurn(size);
  const busy = id => allParties().some(q => q.kind === 'res' && (q.status === 'booked' || q.status === 'arrived') && q.assigned && q.assigned.includes(id) && Math.abs(q.resTime - time) < turn);
  const units = seatUnits(SH.layout).filter(u => !u.bar && u.max >= size && u.min <= size && u.ids.every(id => !busy(id)));
  units.sort((a, b) => (a.max - size) - (b.max - size) || a.ids.length - b.ids.length);
  return units.length ? units[0].ids : null;
}
function addReservation(o) {
  const p = addParty(newParty({ kind: 'res', name: o.name || 'Guest', size: o.size, origSize: o.size, tags: o.tags || [], note: o.note || '', resTime: o.time, status: 'booked', manual: true, assigned: autoAssign(o.size, o.time), hidden: { offset: -2, patience: 40 } }));
  p.arriveTime = o.time - 2;
  SH.order.sort((a, b) => (SH.parties[a].resTime || 9e9) - (SH.parties[b].resTime || 9e9));
  toast(`Booked ${shortName(p)} (${p.size}) at ${fmtTime(o.time)}${p.assigned ? ' on ' + tNames(p.assigned) : ''}.`);
  dirty('add');
  return p;
}

function setSpeed(v) {
  if (!SH) return;
  if (v > 0 && SH.msgs.length && S().pauseOnAlert) { toast('Answer the message first.', 'warn'); return; }
  SH.speed = v; if (v > 0) SH.prevSpeed = v;
  SH.pausedForMsg = false;
  tutorialEvent('speed');
  dirty('speed');
}

/* ---------- UI core: render loop, events, sheets, toasts ---------- */
const UI = { view: 'service', narrow: false, panelSize: 'half', panelBefore: null, tab: 'res', showDone: false, floorMode: 'status', reportId: null };
let _dirty = true;
function dirty() { _dirty = true; }
let _saveT = 0;
function saveSoon() { clearTimeout(_saveT); _saveT = setTimeout(() => { if (SH) DB.shift = SH; saveDB(); }, 400); }

const ACT = {};      // click actions: data-act="name"
const CHANGE = {};   // input/change handlers: data-change="name"

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
['change', 'input'].forEach(type => document.addEventListener(type, e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  if (type === 'input' && !el.matches('input[type=text],input[type=search],textarea,input[type=range],input[type=color]')) return;
  const fn = CHANGE[el.dataset.change];
  if (fn) fn(el, e);
}));

/* ----- toasts ----- */
function toast(text, kind = 'info', action) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast t-' + kind;
  el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(text)}</span>`;
  if (action) { el.dataset.act = action.act; el.dataset.id = action.id; el.classList.add('has-act'); }
  box.appendChild(el);
  while (box.children.length > (UI.narrow ? 2 : 3)) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, kind === 'bad' || kind === 'warn' ? 5200 : 3400);
}

/* ----- sheets (bottom sheet on phones, dialog on larger screens) ----- */
let sheet = null;
function openSheet(render, opts = {}) {
  sheet = { render, live: !!opts.live, cls: opts.cls || '', at: performance.now() };
  drawSheet(true);
}
function drawSheet(first) {
  const layer = $('#sheet-layer');
  if (!sheet) { layer.innerHTML = ''; layer.hidden = true; return; }
  let html;
  try { html = sheet.render(); } catch (e) { console.error(e); html = null; }
  if (html == null) { closeSheet(); return; }
  const body = layer.querySelector('.sheet-body');
  const st = body ? body.scrollTop : 0;
  layer.hidden = false;
  layer.innerHTML = `<div class="scrim" data-act="close-sheet"></div><div class="sheet ${sheet.cls}${first ? ' enter' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  const nb = layer.querySelector('.sheet-body'); if (nb) nb.scrollTop = st;
  if (first) { const f = layer.querySelector('[autofocus]'); if (f && !UI.narrow) f.focus(); }
}
function closeSheet() { sheet = null; drawSheet(); }
ACT['close-sheet'] = el => {
  // a touch tap that opened the sheet also fires a click on the scrim that just appeared under the finger
  if (el && el.classList && el.classList.contains('scrim') && sheet && performance.now() - sheet.at < 450) return;
  closeSheet();
};
function sheetHead(title, sub) {
  return `<div class="sheet-head"><div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div><button class="icon-btn" data-act="close-sheet" aria-label="Close">${icon('x')}</button></div>`;
}

/* ----- in-page confirm (native confirm is not available everywhere) ----- */
function askConfirm({ title, body, ok = 'OK', danger = false, cancel = 'Cancel' }) {
  return new Promise(res => {
    const layer = $('#confirm-layer');
    layer.hidden = false;
    layer.innerHTML = `<div class="scrim"></div><div class="dialog" role="alertdialog" aria-modal="true"><h2>${esc(title)}</h2>${body ? `<p>${esc(body)}</p>` : ''}<div class="row-btns"><button class="btn" data-k="0">${esc(cancel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-k="1">${esc(ok)}</button></div></div>`;
    layer.onclick = e => {
      const b = e.target.closest('[data-k]');
      if (!b && !e.target.classList.contains('scrim')) return;
      layer.hidden = true; layer.innerHTML = ''; layer.onclick = null;
      res(!!b && b.dataset.k === '1');
    };
  });
}

/* ----- views ----- */
const VIEWS = ['service', 'editor', 'history', 'settings', 'help'];
function showView(v) {
  if (UI.view === 'editor' && v !== 'editor') editorLeave();
  if (v !== 'service' && SH && !SH.ended && SH.speed > 0) { SH.prevSpeed = SH.speed; SH.speed = 0; toast('Shift clock paused while you are away from Service.'); }
  UI.view = v;
  VIEWS.forEach(x => { const el = $('#v-' + x); el.hidden = x !== v; });
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if (v === 'editor') editorEnter();
  closeSheet();
  dirty();
  renderNow();
}
ACT.view = el => showView(el.dataset.view);

function applyTheme() {
  const t = S().theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

function checkNarrow() {
  const n = window.innerWidth < 900;
  if (n !== UI.narrow) { UI.narrow = n; dirty(); }
  document.body.classList.toggle('narrow', n);
}
function setPanelSize(s) {
  UI.panelSize = s;
  const svc = $('.svc');
  if (svc) svc.dataset.panel = s;
  setTimeout(() => { fitIfNeeded('svc'); }, 220);
}

/* ----- main loop ----- */
let lastT = performance.now();
let lastSave = 0;
function frame(t) {
  const dtReal = Math.min(0.5, (t - lastT) / 1000);
  lastT = t;
  if (SH && !SH.ended && SH.speed > 0) {
    let simMin = dtReal * SH.speed / 60;
    while (simMin > 0) { const d = Math.min(0.25, simMin); simStep(d); simMin -= d; if (SH.speed === 0) break; }
    updateClock();
    if (t - lastSave > 4000) { lastSave = t; DB.shift = SH; saveDB(); }
  }
  if (_dirty) renderNow();
  requestAnimationFrame(frame);
}
function renderNow() {
  _dirty = false;
  try {
    if (UI.view === 'service') renderService();
    else if (UI.view === 'editor') renderEditor();
    else if (UI.view === 'history') renderHistory();
    else if (UI.view === 'settings') renderSettings();
    else if (UI.view === 'help') renderHelp();
    if (sheet && sheet.live) {
      const a = document.activeElement;
      if (!(a && $('#sheet-layer').contains(a) && a.matches('input,textarea,select'))) drawSheet();
    }
    renderMsgs();
    renderTutorial();
  } catch (e) { console.error(e); }
}

/* ---------- floor plan rendering (SVG) and touch gestures ---------- */
const FV = {}; // view boxes per floor: { svc: {x,y,w,h}, edit: {...} }
const FIT_DONE = {};

function layoutBounds(lay) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = it => {
    const a = (it.rot || 0) * Math.PI / 180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
    const pad = it.kind ? 0 : 14; // room for chairs
    const hw = it.w / 2 * c + it.h / 2 * s + pad, hh = it.w / 2 * s + it.h / 2 * c + pad;
    x0 = Math.min(x0, it.x - hw); y0 = Math.min(y0, it.y - hh); x1 = Math.max(x1, it.x + hw); y1 = Math.max(y1, it.y + hh);
  };
  lay.tables.forEach(add); lay.decor.forEach(add);
  if (!isFinite(x0)) return { x: 0, y: 0, w: lay.width || 1200, h: lay.height || 800 };
  const pad = 20;
  return { x: x0 - pad, y: y0 - pad, w: x1 - x0 + pad * 2, h: y1 - y0 + pad * 2 };
}
function fitView(key, lay) { FV[key] = layoutBounds(lay); FIT_DONE[key] = true; applyView(key); }
function fitIfNeeded(key) {
  const svg = $('#floor-' + key); if (!svg) return;
  const lay = key === 'svc' ? (SH && SH.layout) : edLayout();
  if (lay) fitView(key, lay);
}
function applyView(key) {
  const svg = $('#floor-' + key); const v = FV[key];
  if (svg && v) svg.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);
}
function svgPoint(svg, cx, cy) {
  const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
  const m = svg.getScreenCTM(); if (!m) return { x: 0, y: 0 };
  const r = pt.matrixTransform(m.inverse());
  return { x: r.x, y: r.y };
}
function svgScale(svg) { const m = svg.getScreenCTM(); return m ? m.a : 1; }
function zoomAt(key, factor, cx, cy) {
  const svg = $('#floor-' + key); const v = FV[key]; if (!svg || !v) return;
  const p = cx != null ? svgPoint(svg, cx, cy) : { x: v.x + v.w / 2, y: v.y + v.h / 2 };
  const nw = clamp(v.w / factor, 150, 4000); const f = v.w / nw; const nh = v.h / f;
  v.x = p.x - (p.x - v.x) / f; v.y = p.y - (p.y - v.y) / f; v.w = nw; v.h = nh;
  applyView(key);
}

/* chair positions in table-local coordinates */
function chairSpots(t) {
  const n = Math.min(t.max, 14);
  const out = [];
  if (t.shape === 'bar' || t.shape === 'booth') return out;
  if (t.shape === 'round') {
    const rx = t.w / 2 + 9, ry = t.h / 2 + 9;
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; out.push([Math.cos(a) * rx, Math.sin(a) * ry, a * 180 / Math.PI + 90]); }
    return out;
  }
  const sides = [{ len: t.w, c: 0 }, { len: t.w, c: 0 }, { len: t.h, c: 0 }, { len: t.h, c: 0 }];
  for (let i = 0; i < n; i++) {
    let best = 0, bv = -1;
    sides.forEach((s, j) => { const v = s.len / (s.c + 1); if (v > bv + 0.01) { bv = v; best = j; } });
    sides[best].c++;
  }
  const hw = t.w / 2, hh = t.h / 2, o = 9;
  for (let k = 0; k < sides[0].c; k++) out.push([-hw + t.w * (k + 0.5) / sides[0].c, -hh - o, 0]);
  for (let k = 0; k < sides[1].c; k++) out.push([-hw + t.w * (k + 0.5) / sides[1].c, hh + o, 180]);
  for (let k = 0; k < sides[2].c; k++) out.push([-hw - o, -hh + t.h * (k + 0.5) / sides[2].c, -90]);
  for (let k = 0; k < sides[3].c; k++) out.push([hw + o, -hh + t.h * (k + 0.5) / sides[3].c, 90]);
  return out;
}

function tableBody(t, extraStyle = '') {
  const hw = t.w / 2, hh = t.h / 2;
  if (t.shape === 'round' || t.shape === 'bar') return `<ellipse class="body" cx="0" cy="0" rx="${hw}" ry="${hh}" ${extraStyle}/>`;
  if (t.shape === 'booth') {
    const bench = Math.min(18, t.h * 0.18);
    return `<rect class="bench" x="${-hw}" y="${-hh}" width="${t.w}" height="${t.h}" rx="10"/>` +
      `<rect class="body" x="${-hw + 6}" y="${-hh + bench}" width="${t.w - 12}" height="${t.h - bench * 2}" rx="5" ${extraStyle}/>`;
  }
  return `<rect class="body" x="${-hw}" y="${-hh}" width="${t.w}" height="${t.h}" rx="${t.shape === 'square' ? 6 : 8}" ${extraStyle}/>`;
}

function decorSVG(d, sel) {
  const hw = d.w / 2, hh = d.h / 2;
  let inner = '';
  if (d.kind === 'wall') inner = `<rect class="wall" x="${-hw}" y="${-hh}" width="${d.w}" height="${d.h}" rx="2"/>`;
  else if (d.kind === 'block') inner = `<rect class="block" x="${-hw}" y="${-hh}" width="${d.w}" height="${d.h}" rx="6"/>`;
  else if (d.kind === 'zone') inner = `<rect class="zone" x="${-hw}" y="${-hh}" width="${d.w}" height="${d.h}" rx="12"/>`;
  else inner = `<rect class="lbl-hit" x="${-hw}" y="${-hh}" width="${d.w}" height="${d.h}" rx="4"/>`;
  let text = '';
  if (d.text) {
    const fs = d.kind === 'label' ? clamp(d.h * 0.62, 11, 30) : d.kind === 'zone' ? 15 : clamp(Math.min(d.h * 0.42, d.w / Math.max(3, d.text.length) * 1.5), 10, 22);
    const ty = d.kind === 'zone' ? -hh + 20 : 0;
    const vertical = d.kind !== 'zone' && d.h > d.w * 1.6;
    text = `<text class="dtext k-${d.kind}" x="0" y="${ty}" font-size="${fs}" ${vertical ? 'transform="rotate(-90)"' : ''}>${esc(d.text)}</text>`;
  }
  return `<g class="decor-it${sel ? ' sel' : ''}" data-did="${d.id}" transform="translate(${d.x} ${d.y}) rotate(${d.rot || 0})">${inner}${text}</g>`;
}

/* service floor */
function tableSVGService(t, lay) {
  const st = tableStatus(t.id);
  const s = SH.tables[t.id];
  const p = s && s.pid ? P(s.pid) : null;
  const sec = sectionById(lay, t.sectionId);
  let cls = 'tb st-' + st;
  if (selection) {
    const sp = P(selection.pid);
    if (sp && sp.tableIds.includes(t.id) && (selection.type !== 'seat')) cls += ' sel-self';
    else if (selection.picked.includes(t.id)) cls += ' sel-picked';
    else if (s.state === 'occ') cls += ' sel-no';
    else if (sp) {
      const ids = selection.type === 'add' ? sp.tableIds.concat([t.id]) : [t.id];
      const chk = seatCheck(sp, ids, selection.type === 'seat' ? 'seat' : 'move');
      const real = chk.warns.filter(w => !(selection.combine && w.type === 'small'));
      cls += chk.block ? ' sel-no' : real.length ? ' sel-warn' : ' sel-good';
    }
  }
  if (UI.dropTarget === t.id) cls += ' drop';
  if (UI.floorMode === 'sections') cls += ' secmode';
  const body = tableBody(t, UI.floorMode === 'sections' && sec ? `style="fill:${sec.color}"` : '');
  const filled = p ? Math.min(p.size, t.max) : 0;
  const chairs = chairSpots(t).map(([x, y, r], i) => `<rect class="chair${i < filled ? ' on' : ''}" x="${x - 6}" y="${y - 4.5}" width="12" height="9" rx="3" transform="rotate(${r} ${x} ${y})"/>`).join('');
  const m = Math.min(t.w, t.h);
  const fsName = clamp(m * 0.3, 11, 22);
  let lines = '';
  if (t.shape === 'bar') {
    lines = `<text class="tn" y="1" font-size="${clamp(m * 0.36, 10, 14)}">${esc(t.name)}</text>`;
  } else if (p) {
    const isFirst = p.tableIds[0] === t.id;
    const left = Math.round(minutesLeft(p));
    const over = SH.clock - p.seatedAt > p.turn;
    const timer = S().showTimers ? (over ? `+${Math.round(SH.clock - p.seatedAt - p.turn)}m` : `${left}m`) : '';
    if (!isFirst) {
      lines = `<text class="tn" y="-4" font-size="${fsName}">${esc(t.name)}</text><text class="tl" y="${fsName * 0.75}" font-size="10">with ${esc(tName(p.tableIds[0]))}</text>`;
    } else if (m >= 62) {
      lines = `<text class="tn" y="${-m * 0.2}" font-size="${fsName * 0.85}">${esc(t.name)}</text>` +
        `<text class="tp" y="${m * 0.04}" font-size="${clamp(m * 0.16, 9.5, 13)}">${esc(shortName(p).slice(0, 10))}</text>` +
        `<text class="tl" y="${m * 0.25}" font-size="${clamp(m * 0.15, 9, 12)}">${p.size}p · ${fmtClock(p.seatedAt)}${timer ? ' · ' : ''}<tspan class="${over ? 'over' : ''}">${timer}</tspan></text>`;
    } else {
      lines = `<text class="tn" y="${-m * 0.12}" font-size="${fsName * 0.85}">${esc(t.name)}</text>` +
        `<text class="tl" y="${m * 0.22}" font-size="${clamp(m * 0.2, 9, 12)}">${p.size}p <tspan class="${over ? 'over' : ''}">${timer}</tspan></text>`;
    }
  } else if (st === 'reserved') {
    const h = tableHold(t.id, S().heldWindow);
    lines = `<text class="tn" y="${-m * 0.1}" font-size="${fsName * 0.9}">${esc(t.name)}</text><text class="tl" y="${m * 0.22}" font-size="${clamp(m * 0.17, 9, 12)}">${fmtClock(h.resTime)} ${esc(shortName(h).slice(0, 7))}</text>`;
  } else if (st === 'clearing') {
    lines = `<text class="tn" y="${-m * 0.08}" font-size="${fsName * 0.9}">${esc(t.name)}</text><text class="tl" y="${m * 0.24}" font-size="${clamp(m * 0.17, 9, 12)}">bus</text>`;
  } else {
    lines = `<text class="tn" y="${-m * 0.04}" font-size="${fsName}">${esc(t.name)}</text><text class="tc" y="${m * 0.26}" font-size="${clamp(m * 0.15, 8.5, 11)}">${t.min}–${t.max}</text>`;
  }
  const secDot = sec && t.shape !== 'bar' && UI.floorMode !== 'sections' ? `<circle class="secdot" cx="${-t.w / 2 + 7}" cy="${-t.h / 2 + 7}" r="4" style="fill:${sec.color}"/>` : '';
  const pref = allParties().some(q => q.prefTable === t.id && q.status !== 'seated' && q.status !== 'done' && !['walked', 'noshow', 'cancelled', 'turned', 'declined'].includes(q.status)) ? `<g class="pref-star" transform="translate(${t.w / 2 - 4} ${-t.h / 2 + 4}) scale(.55)"><path d="M0 -10 l2.6 5.3 5.8.8-4.2 4.1 1 5.8L0 3.3 -5.2 6 -4.2 .2 -8.4-3.9 -2.6-4.7z"/></g>` : '';
  return `<g class="${cls}" data-tid="${t.id}" transform="translate(${t.x} ${t.y})"><g transform="rotate(${t.rot || 0})">${chairs}${body}${secDot}</g>${pref}<g class="tt">${lines}</g></g>`;
}

function renderServiceFloor() {
  const svg = $('#floor-svc'); if (!svg || !SH) return;

/* ----- gestures shared by both floors ----- */
function attachFloorGestures(svg, key, handlers) {
  const ptrs = new Map();
  let g = null;
  svg.addEventListener('pointerdown', e => {
    if (e.button && e.button !== 0) return;
    try { svg.setPointerCapture(e.pointerId); } catch (_) { }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      if (g && g.kind !== 'pan' && g.kind !== 'pending' && handlers.cancel) handlers.cancel(g);
      g = { kind: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), v0: Object.assign({}, FV[key]), mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
      return;
    }
    if (ptrs.size > 2) return;
    const tgt = e.target.closest('[data-tid],[data-did],[data-handle]');
    g = { kind: 'pending', sx: e.clientX, sy: e.clientY, v0: Object.assign({}, FV[key]), target: tgt, id: e.pointerId, t0: performance.now() };
    if (tgt && tgt.dataset.handle && handlers.handleDown) { g.kind = 'handle'; handlers.handleDown(g, e); }
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!g) return;
    if (g.kind === 'pinch') {
      if (ptrs.size < 2) return;
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const f = d / (g.d0 || 1);
      FV[key] = Object.assign({}, g.v0); applyView(key);
      zoomAt(key, f, g.mid.x, g.mid.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const s = svgScale(svg);
      FV[key].x -= (mid.x - g.mid.x) / s; FV[key].y -= (mid.y - g.mid.y) / s; applyView(key);
      return;
    }
    if (e.pointerId !== g.id) return;
    const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
    if (g.kind === 'pending' && Math.hypot(dx, dy) > 8) {
      g.kind = (handlers.dragStart && handlers.dragStart(g, e)) || 'pan';
    }
    if (g.kind === 'pan') {
      const s = svgScale(svg);
      FV[key].x = g.v0.x - dx / s; FV[key].y = g.v0.y - dy / s; applyView(key);
    } else if (g.kind !== 'pending' && handlers.dragMove) handlers.dragMove(g, e);
  });
  const end = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (!g) return;
    if (g.kind === 'pinch') { if (ptrs.size === 0) g = null; else g = { kind: 'done' }; return; }
    if (e.pointerId !== g.id) return;
    if (g.kind === 'pending' && e.type === 'pointerup') handlers.tap && handlers.tap(g.target, e);
    else if (g.kind !== 'pan' && g.kind !== 'done' && handlers.dragEnd) handlers.dragEnd(g, e, e.type === 'pointercancel');
    g = null;
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(key, e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY); }, { passive: false });
}

ACT.zoom = el => { const k = el.dataset.key; if (el.dataset.dir === 'fit') fitIfNeeded(k); else zoomAt(k, el.dataset.dir === 'in' ? 1.25 : 0.8); };

function floorTools(key) {
  return `<div class="floor-tools">
    <button class="icon-btn" data-act="zoom" data-key="${key}" data-dir="in" aria-label="Zoom in">${icon('zoomin')}</button>
    <button class="icon-btn" data-act="zoom" data-key="${key}" data-dir="out" aria-label="Zoom out">${icon('zoomout')}</button>
    <button class="icon-btn" data-act="zoom" data-key="${key}" data-dir="fit" aria-label="Fit floor">${icon('fit')}</button>
  </div>`;
}

/* ---------- live service screen ---------- */
function setHTML(el, html) { if (el && el._h !== html) { el.innerHTML = html; el._h = html; } }
const DONE_STATES = ['done', 'noshow', 'cancelled', 'walked', 'turned', 'declined'];

function renderService() {
  const root = $('#v-service');
  if (!SH) { setHTML(root, startScreenHTML()); return; }
  if (SH.ended) { setHTML(root, reportHTML(SH.report, true)); return; }
  if (!root.querySelector('.svc') || root.dataset.shift !== SH.id) buildServiceSkeleton(root);
  renderShiftBar();
  renderServiceFloor();
  renderPanel();
  renderSelBar();
}

function buildServiceSkeleton(root) {
  root.dataset.shift = SH.id;
  root._h = null;
  root.innerHTML = `<div class="svc" data-panel="${UI.panelSize}">
    <div class="shiftbar" id="shiftbar"></div>
    <div id="coach"></div>
    <div class="svc-body">
      <div class="floor-wrap">
        <svg id="floor-svc" class="floor" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Floor plan"></svg>
        <div id="selbar"></div>
        ${floorTools('svc')}
        <div class="floor-mode seg sm">
          <button data-act="floor-mode" data-m="status" class="${UI.floorMode === 'status' ? 'on' : ''}">Status</button>
          <button data-act="floor-mode" data-m="sections" class="${UI.floorMode === 'sections' ? 'on' : ''}">Sections</button>
          <button data-act="legend" aria-label="Status colors">Key</button>
        </div>
      </div>
      <aside class="panel" id="panel"></aside>
    </div>
  </div>`;
  FIT_DONE.svc = false;
  const svg = $('#floor-svc');
  attachFloorGestures(svg, 'svc', {
    tap(tgt) {
      const tid = tgt && tgt.closest('[data-tid]') && tgt.closest('[data-tid]').dataset.tid;
      if (!tid) return;
      if (selection) selectionTap(tid); else openTableSheet(tid);
    },
    dragStart(g) {
      if (selection || !g.target) return null;
      const tEl = g.target.closest('[data-tid]'); if (!tEl) return null;
      const s = SH.tables[tEl.dataset.tid];
      if (!s || s.state !== 'occ') return null;
      const p = P(s.pid);
      g.pid = p.id; g.from = tEl.dataset.tid;
      showGhost(`${shortName(p)} (${p.size})`, g.sx, g.sy);
      return 'party';
    },
    dragMove(g, e) { moveGhost(e.clientX, e.clientY); setDropTarget(tableUnder(e.clientX, e.clientY)); },
    dragEnd(g, e, cancelled) {
      hideGhost(); const tid = UI.dropTarget; setDropTarget(null);
      if (cancelled || !tid || tid === g.from) return;
      const p = P(g.pid); if (!p) return;
      if (p.tableIds.includes(tid)) return;
      beginSelection('move', p.id); selectionTap(tid);
    },
  });
  // keep the floor fitted when the container changes size
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => fitIfNeeded('svc')); ro.observe($('.floor-wrap')); }
}

ACT['floor-mode'] = el => { UI.floorMode = el.dataset.m; $$('.floor-mode [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === UI.floorMode)); dirty(); };
ACT.legend = () => openSheet(() => sheetHead('Table status colors') + `<div class="sheet-body"><div class="legend">${STATUS_ORDER.map(s => `<div class="lg"><span class="sw st-${s}"></span><b>${STATUS_META[s].label}</b><span>${legendText(s)}</span></div>`).join('')}</div><p class="muted small">Filled chairs show how many guests are at a table. Empty chairs at a seated table are wasted seats. The colored dot in the corner is the server section.</p></div>`);
function legendText(s) {
  return { available: 'Clean and free.', reserved: `A booking is due within ${S().heldWindow} min.`, seated: 'Guests just sat down.', ordered: 'Order is in.', mains: 'Entrées on the table.', dessert: 'Dessert or coffee.', check: 'Check is on the table.', paid: 'Paid, about to leave.', clearing: 'Guests left. Needs bussing.' }[s];
}

/* ----- shift bar ----- */
function renderShiftBar() {
  const el = $('#shiftbar'); if (!el) return;
  const speeds = [0, 1, 5, 10, 30];
  const waiting = allParties().filter(p => p.status === 'waiting' || p.status === 'new').length;
  const arrived = allParties().filter(p => p.status === 'arrived').length;
  const covers = sum(allParties().filter(p => p.seatedAt != null), p => p.size);
  setHTML(el, `
    <div class="clock" aria-live="off"><span id="ck">${fmtClock(SH.clock)}</span><span class="ap" id="ck-ap">${SH.clock % 1440 >= 720 ? 'pm' : 'am'}</span></div>
    <div class="seg speed" role="group" aria-label="Clock speed">${speeds.map(v => `<button data-act="speed" data-v="${v}" class="${SH.speed === v ? 'on' : ''}" aria-label="${v ? v + ' times speed' : 'Pause'}">${v === 0 ? icon('pause') : v + '×'}</button>`).join('')}</div>
    <div class="kpis">
      <span class="kpi" title="Seats in use"><b>${Math.round(occupancy() * 100)}%</b> full</span>
      <span class="kpi" title="Guests waiting"><b>${waiting + arrived}</b> waiting</span>
      <span class="kpi hide-sm" title="Covers seated this shift"><b>${covers}</b> covers</span>
      ${SH.kitchen && SH.clock < SH.kitchen.until ? `<span class="kpi warn">${icon('fire')} Kitchen slow</span>` : ''}
    </div>
    <div class="sb-right">
      <span class="shift-name hide-sm">${esc(SHIFT_TYPES[SH.type].name)}</span>
      <button class="btn sm" data-act="end-shift">End shift</button>
    </div>`);
}
function updateClock() {
  const ck = $('#ck'); if (ck) ck.textContent = fmtClock(SH.clock);
  const ap = $('#ck-ap'); if (ap) ap.textContent = SH.clock % 1440 >= 720 ? 'pm' : 'am';
}
ACT.speed = el => setSpeed(+el.dataset.v);

/* ----- side / bottom panel ----- */
function panelCounts() {
  const ps = allParties();
  return {
    res: ps.filter(p => p.kind === 'res' && (p.status === 'booked' || p.status === 'arrived')).length,
    arrived: ps.filter(p => p.kind === 'res' && p.status === 'arrived').length,
    wait: ps.filter(p => p.kind === 'walk' && (p.status === 'waiting' || p.status === 'new')).length,
    newW: ps.filter(p => p.kind === 'walk' && p.status === 'new').length,
    seated: ps.filter(p => p.status === 'seated').length,
  };
}
function renderPanel() {
  const el = $('#panel'); if (!el) return;
  const c = panelCounts();
  const load = sectionLoad();
  const secs = SH.layout.sections.filter(s => load[s.id] && load[s.id].tables > 0);
  const strip = secs.map(s => `<div class="secchip${serverOnBreak(s.id) ? ' onbreak' : ''}" title="${esc(s.name)}"><span class="dot" style="background:${s.color}"></span><span class="sv">${esc(s.server || s.name)}</span><span class="cv"><b>${load[s.id].now}</b>/${load[s.id].total}</span>${serverOnBreak(s.id) ? icon('coffee') : ''}</div>`).join('');
  const tab = (k, label, n, badge) => `<button role="tab" aria-selected="${UI.tab === k}" class="${UI.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}">${label}<span class="cnt">${n}</span>${badge ? `<span class="badge">${badge}</span>` : ''}</button>`;
  setHTML(el, `
    <button class="panel-handle" data-act="panel-toggle" aria-label="Resize list"><span></span></button>
    <div class="secstrip" aria-label="Covers per server (on floor / total)">${strip}</div>
    <div class="tabs" role="tablist">
      ${tab('res', 'Reservations', c.res, c.arrived ? c.arrived + ' here' : '')}
      ${tab('wait', 'Waitlist', c.wait, c.newW ? c.newW + ' new' : '')}
      ${tab('seated', 'Seated', c.seated)}
    </div>
    <div class="plist" id="plist">${UI.tab === 'res' ? resListHTML() : UI.tab === 'wait' ? waitListHTML() : seatedListHTML()}</div>
    <div class="panel-foot">
      <button class="btn" data-act="add-walkin">${icon('plus')} Walk-in</button>
      <button class="btn" data-act="add-res">${icon('plus')} Reservation</button>
    </div>`);
}
ACT.tab = el => { UI.tab = el.dataset.tab; if (UI.narrow && UI.panelSize === 'min') setPanelSize('half'); dirty(); tutorialEvent('tab'); };
ACT['panel-toggle'] = () => { setPanelSize(UI.panelSize === 'min' ? 'half' : UI.panelSize === 'half' ? 'full' : 'min'); };

function tagIcons(p) { return p.tags.map(t => TAGS[t] ? `<span class="tag tag-${t}" title="${TAGS[t].label}">${icon(TAGS[t].icon)}</span>` : '').join(''); }
function rowHTML(p, { time, sub, right, cls = '' }) {
  const sel = selection && selection.pid === p.id ? ' selected' : '';
  const grip = ['arrived', 'waiting', 'new', 'booked'].includes(p.status) ? `<span class="grip" data-grip="${p.id}" aria-hidden="true">${icon('grip')}</span>` : '<span class="grip off"></span>';
  return `<div class="prow ${cls}${sel}" data-act="party-tap" data-id="${p.id}" role="button" tabindex="0">
    ${grip}
    <div class="ptime">${time || ''}</div>
    <div class="pmain"><div class="pname">${esc(p.name)} ${tagIcons(p)}</div><div class="psub">${sub || ''}</div></div>
    <div class="psize">${p.size}</div>
    <div class="pright">${right || ''}</div>
    <button class="icon-btn pmore" data-act="party-more" data-id="${p.id}" aria-label="Details">${icon('more')}</button>
  </div>`;
}

function resListHTML() {
  const ps = allParties().filter(p => p.kind === 'res');
  const arrived = ps.filter(p => p.status === 'arrived').sort((a, b) => partyWaitStart(a) - partyWaitStart(b));
  const upcoming = ps.filter(p => p.status === 'booked').sort((a, b) => a.resTime - b.resTime);
  const done = ps.filter(p => p.status === 'seated' || DONE_STATES.includes(p.status)).sort((a, b) => a.resTime - b.resTime);
  let h = '';
  if (arrived.length) {
    h += `<div class="ghead">Checked in, need a table</div>`;
    h += arrived.map(p => {
      const w = Math.round(SH.clock - partyWaitStart(p));
      return rowHTML(p, { time: fmtClock(p.resTime), cls: 'is-here', sub: `${p.assigned ? 'Booked ' + tNames(p.assigned) : 'No table set'}${p.flags.atBar ? ' · at the bar' : ''}${p.prefTable ? ' · wants ' + tName(p.prefTable) : ''}`, right: `<span class="pill ${w > 10 ? 'bad' : w > 5 ? 'warn' : 'ok'}">${w > 0 ? w + 'm wait' : 'Here'}</span>` });
    }).join('');
  }
  h += `<div class="ghead">Upcoming</div>`;
  if (!upcoming.length) h += `<div class="empty">No more reservations on the book.</div>`;
  h += upcoming.map(p => {
    const late = SH.clock - p.resTime;
    const pill = late > 0 ? `<span class="pill ${late >= S().lateGrace ? 'bad' : 'warn'}">${Math.round(late)}m late</span>` : (p.resTime - SH.clock <= 15 ? `<span class="pill">in ${Math.round(p.resTime - SH.clock)}m</span>` : '');
    return rowHTML(p, { time: fmtClock(p.resTime), sub: `${p.assigned ? tNames(p.assigned) : 'No table set'}${p.note ? ' · ' + esc(p.note) : ''}`, right: pill });
  }).join('');
  if (done.length) {
    h += `<button class="ghead tgl" data-act="toggle-done">${UI.showDone ? icon('chevup') : icon('chevdown')} Seated and finished (${done.length})</button>`;
    if (UI.showDone) h += done.map(p => rowHTML(p, { time: fmtClock(p.resTime), cls: 'is-done', sub: p.status === 'seated' ? 'At ' + tNames(p.tableIds) : statusWord(p), right: `<span class="pill">${statusWord(p)}</span>` })).join('');
  }
  return h;
}
ACT['toggle-done'] = () => { UI.showDone = !UI.showDone; dirty(); };
function statusWord(p) {
  return { seated: 'Seated', done: 'Finished', noshow: 'No-show', cancelled: 'Cancelled', walked: 'Walked out', turned: 'Turned away', declined: 'Declined wait', arrived: 'Here', booked: 'Booked', waiting: 'Waiting', new: 'New' }[p.status] || p.status;
}

function waitListHTML() {
  const ps = allParties().filter(p => p.kind === 'walk');
  const fresh = ps.filter(p => p.status === 'new').sort((a, b) => a.addedAt - b.addedAt);
  const waiting = ps.filter(p => p.status === 'waiting').sort((a, b) => a.addedAt - b.addedAt);
  const done = ps.filter(p => p.status === 'seated' || DONE_STATES.includes(p.status));
  let h = '';
  if (fresh.length) {
    h += `<div class="ghead">At the stand, need a quote</div>`;
    h += fresh.map(p => rowHTML(p, { time: fmtClock(p.addedAt), cls: 'is-new', sub: `Arrived ${Math.round(SH.clock - p.addedAt)}m ago. Tap to quote or seat.`, right: `<span class="pill warn">Quote</span>` })).join('');
  }
  h += `<div class="ghead">Waiting</div>`;
  if (!waiting.length) h += `<div class="empty">Nobody on the waitlist.</div>`;
  h += waiting.map((p, i) => {
    const w = SH.clock - p.addedAt;
    const pct = p.quote ? clamp(w / p.quote, 0, 1.5) : (w > 0 ? 1.5 : 0);
    const over = w > p.quote;
    return rowHTML(p, { time: '#' + (i + 1), sub: `<span class="qbar${over ? ' over' : ''}"><span style="width:${Math.min(100, pct / 1.5 * 100)}%"></span><i style="left:${100 / 1.5}%"></i></span><span class="qtxt">${p.quote ? `${Math.round(w)}m of ${p.quote}m quoted` : `Seat now · waited ${Math.round(w)}m`}</span>`, right: `<span class="pill ${over ? 'bad' : w > p.quote - 3 ? 'warn' : 'ok'}">${over ? '+' + Math.round(w - p.quote) + 'm' : Math.round(p.quote - w) + 'm left'}</span>` });
  }).join('');
  if (done.length) {
    h += `<button class="ghead tgl" data-act="toggle-done">${UI.showDone ? icon('chevup') : icon('chevdown')} Seated and gone (${done.length})</button>`;
    if (UI.showDone) h += done.map(p => rowHTML(p, { time: fmtClock(p.addedAt), cls: 'is-done', sub: p.status === 'seated' ? 'At ' + tNames(p.tableIds) : esc(p.outcome || statusWord(p)), right: `<span class="pill">${statusWord(p)}</span>` })).join('');
  }
  return h;
}

function seatedListHTML() {
  const ps = allParties().filter(p => p.status === 'seated').sort((a, b) => minutesLeft(a) - minutesLeft(b));
  if (!ps.length) return `<div class="empty">No one is seated yet.</div>`;
  return ps.map(p => {
    const left = Math.round(minutesLeft(p));
    const over = SH.clock - p.seatedAt > p.turn;

function tableUnder(x, y) {

(function guestDrag() {
  let d = null;
  document.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-grip]'); if (!g || !SH) return;

/* ----- quote sheet ----- */
function estimateWait(p) {
  const units = seatUnits(SH.layout).filter(u => u.max >= p.size && u.min <= p.size + 1 && !(u.bar && p.size > 2));
  if (!units.length) return null;
  const turn = expectedTurn(p.size);
  const freeFor = id => {
    // a table that is free now but booked before this party would finish opens up after that booking instead
    let t = expectedFreeAt(id);
    const h = tableHold(id, Math.max(0, t - SH.clock) + turn - 5);
    if (h && h.id !== p.id) t = Math.max(t, h.resTime + expectedTurn(h.size));
    return t;
  };
  const times = units.map(u => Math.max(...u.ids.map(freeFor))).sort((a, b) => a - b);
  const ahead = allParties().filter(q => q.id !== p.id && (q.status === 'waiting' || q.status === 'arrived') && Math.abs(q.size - p.size) <= 2 && partyWaitStart(q) <= (p.addedAt || SH.clock)).length;
  const t = times[Math.min(ahead, times.length - 1)] + (ahead >= times.length ? 20 : 0);
  return { mins: Math.max(0, Math.round(t - SH.clock)), ahead };
}

  openSheet(() => {
    const p = P(pid); if (!p || !SH) return null;
    if (p.status !== 'new' && p.status !== 'waiting') return null;

    const opts = [0, 5, 10, 15, 20, 25, 30, 40, 45, 60, 75, 90];
    return sheetHead(`Quote ${esc(shortName(p))} (${p.size})`, `Walk-in at the stand since ${fmtTime(p.addedAt)}`) + `<div class="sheet-body">

      <div class="field"><label>Quoted wait (minutes)</label><div class="quotes">${opts.map(q => `<button class="chip lg${p.quote === q ? ' on' : ''}" data-act="quote" data-id="${p.id}" data-q="${q}">${q === 0 ? 'Now' : q}</button>`).join('')}</div></div>

  }, { live: true });
}

/* ---------- floor plan editor ---------- */
const ED = { layoutId: null, sel: null, selKind: null, mode: 'select', paintSec: null, comboPick: [], undo: [], tab: 'add', built: false };
function edLayout() { return DB.layouts.find(l => l.id === ED.layoutId) || activeLayout(); }
function edItem() { const L = edLayout(); return ED.selKind === 'table' ? L.tables.find(t => t.id === ED.sel) : ED.selKind === 'decor' ? L.decor.find(d => d.id === ED.sel) : null; }
function pushUndo() { ED.undo.push(JSON.stringify(edLayout())); if (ED.undo.length > 40) ED.undo.shift(); }
function edChanged() { saveSoon(); dirty(); }

function editorEnter() {
  if (!ED.layoutId || !DB.layouts.find(l => l.id === ED.layoutId)) ED.layoutId = DB.activeLayoutId;

function buildEditorSkeleton(root) {
  ED.built = true;
  root.innerHTML = `<div class="ed svc" data-panel="${UI.panelSize}">
    <div class="shiftbar ed-bar" id="ed-bar"></div>
    <div class="svc-body">
      <div class="floor-wrap ed-floor">
        <svg id="floor-edit" class="floor editing" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Floor plan editor"></svg>
        <div id="ed-mode"></div>
        ${floorTools('edit')}
        <div class="floor-mode"><button class="icon-btn" data-act="ed-undo" aria-label="Undo">${icon('undo')}</button></div>
      </div>
      <aside class="panel ed-panel" id="ed-panel"></aside>
    </div>
  </div>`;
  FIT_DONE.edit = false;
  const svg = $('#floor-edit');
  attachFloorGestures(svg, 'edit', {
    tap(tgt) {
      const L = edLayout();
      const tEl = tgt && tgt.closest('[data-tid]'); const dEl = tgt && tgt.closest('[data-did]');
      if (ED.mode === 'paint') { if (tEl && ED.paintSec) { pushUndo(); L.tables.find(t => t.id === tEl.dataset.tid).sectionId = ED.paintSec; edChanged(); } return; }
      if (ED.mode === 'combo') {
        if (tEl) { const id = tEl.dataset.tid; const i = ED.comboPick.indexOf(id); if (i >= 0) ED.comboPick.splice(i, 1); else ED.comboPick.push(id); dirty(); }
        return;
      }
      if (tEl) { ED.sel = tEl.dataset.tid; ED.selKind = 'table'; }
      else if (dEl) { ED.sel = dEl.dataset.did; ED.selKind = 'decor'; }
      else { ED.sel = null; ED.selKind = null; }
      if (UI.narrow && ED.sel && UI.panelSize === 'min') setPanelSize('half');
      dirty();
    },
    dragStart(g) {
      if (ED.mode !== 'select' || !g.target) return null;
      const tEl = g.target.closest('[data-tid]'); const dEl = g.target.closest('[data-did]');
      if (!tEl && !dEl) return null;
      ED.sel = tEl ? tEl.dataset.tid : dEl.dataset.did; ED.selKind = tEl ? 'table' : 'decor';
      const it = edItem(); if (!it) return null;
      pushUndo();
      g.ox = it.x; g.oy = it.y;
      return 'item';
    },
    handleDown(g) {
      const it = edItem(); if (!it) return;
      pushUndo();
      g.kind = g.target.dataset.handle; // resize | rotate
      // resize keeps the opposite corner where it is
      const r = (it.rot || 0) * Math.PI / 180;
      g.anchor = { x: it.x - (it.w / 2) * Math.cos(r) + (it.h / 2) * Math.sin(r), y: it.y - (it.w / 2) * Math.sin(r) - (it.h / 2) * Math.cos(r) };
    },
    dragMove(g, e) {
      const it = edItem(); if (!it) return;
      const svg = $('#floor-edit');
      if (g.kind === 'item') {
        const s = svgScale(svg);
        it.x = Math.round((g.ox + (e.clientX - g.sx) / s) / 5) * 5;
        it.y = Math.round((g.oy + (e.clientY - g.sy) / s) / 5) * 5;
      } else if (g.kind === 'resize' || g.kind === 'rotate') {
        const p = svgPoint(svg, e.clientX, e.clientY);
        const dx = p.x - it.x, dy = p.y - it.y;
        if (g.kind === 'rotate') {
          let a = Math.atan2(dy, dx) * 180 / Math.PI + 90;
          a = Math.round(a / 15) * 15; it.rot = ((a % 360) + 360) % 360;
        } else {
          const a = (it.rot || 0) * Math.PI / 180;
          const vx = p.x - g.anchor.x, vy = p.y - g.anchor.y;
          const lx = vx * Math.cos(a) + vy * Math.sin(a), ly = -vx * Math.sin(a) + vy * Math.cos(a);
          const minS = ED.selKind === 'table' ? 24 : 8;
          let w = Math.max(minS, Math.round(lx / 5) * 5), h = Math.max(minS, Math.round(ly / 5) * 5);
          if (ED.selKind === 'table' && (it.shape === 'round' || it.shape === 'square' || it.shape === 'bar')) w = h = Math.max(w, h);
          it.w = w; it.h = h;
          it.x = g.anchor.x + (w / 2) * Math.cos(a) - (h / 2) * Math.sin(a);
          it.y = g.anchor.y + (w / 2) * Math.sin(a) + (h / 2) * Math.cos(a);
        }
      }
      renderEditorFloor();
    },
    dragEnd() { const it = edItem(); if (it) { it.x = Math.round(it.x); it.y = Math.round(it.y); } edChanged(); },
  });
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => fitIfNeeded('edit')); ro.observe(root.querySelector('.ed-floor')); }
}

function renderEditorFloor() {
  const svg = $('#floor-edit'); if (!svg) return;
  const L = edLayout();
  if (!FIT_DONE.edit) fitView('edit', L);
  const scale = svgScale(svg) || 1;
  const tablesHTML = L.tables.map(t => {
    const sec = sectionById(L, t.sectionId);
    const sel = ED.selKind === 'table' && ED.sel === t.id;
    const picked = ED.comboPick.includes(t.id);
    const inCombo = ED.mode === 'combo' && L.combos.some(c => c.tableIds.includes(t.id));
    const chairs = chairSpots(t).map(([x, y, r]) => `<rect class="chair" x="${x - 6}" y="${y - 4.5}" width="12" height="9" rx="3" transform="rotate(${r} ${x} ${y})"/>`).join('');
    const m = Math.min(t.w, t.h);
    const fs = clamp(m * 0.3, 10, 22);
    return `<g class="tb ed-t${sel ? ' sel' : ''}${picked ? ' sel-picked' : ''}${inCombo ? ' in-combo' : ''}${!t.combinable ? ' nocomb' : ''}" data-tid="${t.id}" transform="translate(${t.x} ${t.y})">
      <g transform="rotate(${t.rot || 0})">${chairs}${tableBody(t, sec ? `style="fill:${sec.color}"` : '')}</g>
      <g class="tt"><text class="tn" y="${t.shape === 'bar' ? 1 : -m * 0.05}" font-size="${t.shape === 'bar' ? 11 : fs}">${esc(t.name)}</text>${t.shape !== 'bar' ? `<text class="tc" y="${m * 0.27}" font-size="${clamp(m * 0.15, 8.5, 11)}">${t.min}–${t.max}</text>` : ''}</g></g>`;
  }).join('');
  let handles = '';
  const it = edItem();
  if (it && ED.mode === 'select') {
    const r = (it.rot || 0) * Math.PI / 180;
    const rotp = (x, y) => [it.x + x * Math.cos(r) - y * Math.sin(r), it.y + x * Math.sin(r) + y * Math.cos(r)];
    const hr = 12 / scale;
    const [rx, ry] = rotp(it.w / 2, it.h / 2);
    const [ox, oy] = rotp(0, -it.h / 2 - 34 / scale);
    const [tx, ty] = rotp(0, -it.h / 2);
    handles = `<g class="handles"><line x1="${tx}" y1="${ty}" x2="${ox}" y2="${oy}" stroke-width="${1.5 / scale}"/>
      <circle data-handle="resize" class="h-resize" cx="${rx}" cy="${ry}" r="${hr}" stroke-width="${2 / scale}"/>
      <circle data-handle="rotate" class="h-rotate" cx="${ox}" cy="${oy}" r="${hr}" stroke-width="${2 / scale}"/></g>`;
  }
  svg.innerHTML = `<g class="decor">${L.decor.map(d => decorSVG(d, ED.selKind === 'decor' && ED.sel === d.id)).join('')}</g><g class="tables">${tablesHTML}</g>${handles}`;
}

/* ---------- scoring, report and history ---------- */
const avg = a => a.length ? sum(a) / a.length : 0;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const lin = (v, a, b) => clamp((v - a) / (b - a) * 100, 0, 100); // a->0, b->100

function buildReport(sh) {
  const ps = sh.order.map(id => sh.parties[id]);
  const seated = ps.filter(p => p.seatedAt != null);
  const covers = sum(seated, p => p.size);
  const res = ps.filter(p => p.kind === 'res' && p.status !== 'cancelled' && (p.resTime <= sh.clock || p.status !== 'booked'));
  const resSeated = res.filter(p => p.seatedAt != null);
  const resWaits = resSeated.map(p => Math.max(0, p.seatedAt - partyWaitStart(p)));
  const onTime = resWaits.filter(w => w <= 10).length;
  const noShows = res.filter(p => p.status === 'noshow').length;
  const walks = ps.filter(p => p.kind === 'walk' && p.status !== 'cancelled');
  const walkSeated = walks.filter(p => p.seatedAt != null);
  const walkWaits = walkSeated.map(p => p.seatedAt - p.addedAt);
  const quoted = walkSeated.filter(p => p.quote != null && p.quotedAt != null);
  const errs = quoted.map(p => (p.seatedAt - p.addedAt) - p.quote);
  const accurate = errs.filter(e => e <= 5 && e >= -10).length;
  const under = errs.filter(e => e > 5), over = errs.filter(e => e < -10);
  const walked = ps.filter(p => p.status === 'walked');
  const ignored = walked.filter(p => p.kind === 'walk' && p.quote == null).length;
  const declined = ps.filter(p => p.status === 'declined');
  const turned = ps.filter(p => p.status === 'turned');
  const arrivedCovers = sum(ps.filter(p => p.seatedAt != null || p.status === 'walked' || p.status === 'declined' || p.status === 'arrived' || p.status === 'waiting' || p.status === 'new'), p => p.size);
  const walkedCovers = sum(walked, p => p.size);
  const eff = sh.stats.capMin ? sh.stats.seatMin / sh.stats.capMin : 1;
  const bigWaste = seated.filter(p => capacityOf(sh.layout, p.tableIds).max - p.size >= 3).map(p => `${p.size} at ${tNames(p.tableIds)}`);
  // server balance: covers per seat in each section
  const secs = sh.layout.sections.map(s => {
    const tabs = sh.layout.tables.filter(t => t.sectionId === s.id);
    return { name: s.name, bar: tabs.length > 0 && tabs.every(t => t.shape === 'bar'), server: s.server || s.name, color: s.color, seats: sum(tabs, t => t.max), covers: sum(seated.filter(p => p.sectionId === s.id), p => p.size) };
  }).filter(s => s.seats > 0 && !s.bar);
  const ratios = secs.map(s => s.covers / s.seats);
  const mean = avg(ratios);
  const cv = mean ? Math.sqrt(avg(ratios.map(r => (r - mean) ** 2))) / mean : 0;
  const curve = sh.stats.curve.map(c => Object.assign({}, c, { result: c.result === 'pending' ? 'poor' : c.result }));
  const cvScore = curve.length ? avg(curve.map(c => ({ good: 100, ok: 60, poor: 15 }[c.result] ?? 0))) : null;
  const ov = {}; sh.stats.overrides.forEach(o => ov[o.type] = (ov[o.type] || 0) + 1);
  const ovTotal = sh.stats.overrides.length;

  const comp = {
    onTime: resSeated.length ? { score: pct(onTime, resSeated.length), w: 18, label: 'Reservations on time' } : null,
    wait: seated.length ? { score: Math.round(clamp(100 - Math.max(0, avg(resWaits) - 3) * 4 - Math.max(0, avg(under) ) * 1.2 * (under.length / Math.max(1, errs.length)), 0, 100)), w: 12, label: 'Guest wait' } : null,
    quote: errs.length ? { score: pct(accurate, errs.length), w: 14, label: 'Quote accuracy' } : null,
    walkouts: arrivedCovers ? { score: Math.round(clamp(100 - (walkedCovers / arrivedCovers) * 400, 0, 100)), w: 16, label: 'Walk-outs' } : null,
    eff: seated.length ? { score: Math.round(lin(eff, 0.55, 0.88)), w: 10, label: 'Seat efficiency' } : null,
    balance: secs.length > 1 && covers > 0 ? { score: Math.round(clamp(100 - cv * 120, 0, 100)), w: 10, label: 'Server balance' } : null,
    curve: cvScore != null ? { score: Math.round(cvScore), w: 10, label: 'Curveballs' } : null,
    discipline: seated.length ? { score: Math.round(clamp(100 - ovTotal * 9, 0, 100)), w: 10, label: 'Floor discipline' } : null,
  };
  const active = Object.entries(comp).filter(([, c]) => c);
  const tw = sum(active, ([, c]) => c.w);
  const score = tw ? Math.round(sum(active, ([, c]) => c.score * c.w) / tw) : 0;
  const grade = gradeFor(score);

  const m = {
    covers, parties: seated.length, resTotal: res.length, resSeated: resSeated.length, onTime, noShows,
    avgResWait: Math.round(avg(resWaits) * 10) / 10, avgWalkWait: Math.round(avg(walkWaits) * 10) / 10,
    quoted: errs.length, accurate, under: under.length, over: over.length, avgUnder: Math.round(avg(under)), avgOver: Math.round(-avg(over)),
    walked: walked.length, walkedCovers, ignored, declined: declined.length, declinedCovers: sum(declined, p => p.size), turned: turned.length,
    eff: Math.round(eff * 100), bigWaste: bigWaste.length, secs, overrides: ov, ovTotal,
    curveTotal: curve.length, curveGood: curve.filter(c => c.result === 'good').length,
  };
  const tips = buildTips(comp, m, curve, bigWaste);
  return { id: sh.id, date: Date.now(), type: sh.type, venue: sh.venue, layoutName: sh.layout.name, score, grade, comp, m, tips, curve, shiftStart: sh.startMin, shiftEnd: sh.endMin };
}
function gradeFor(s) {
  const L = s >= 90 ? 'A' : s >= 80 ? 'B' : s >= 70 ? 'C' : s >= 60 ? 'D' : 'F';
  if (L === 'F') return 'F';
  const r = s % 10;
  return L + (s >= 97 ? '+' : L !== 'A' && r >= 7 ? '+' : r <= 2 ? '−' : '');
}

function buildTips(comp, m, curve, bigWaste) {
  const T = {
    onTime: () => `Only ${m.onTime} of ${m.resSeated} reservations sat within 10 minutes of arriving. Look ${S().heldWindow} minutes ahead: keep booked tables clear, bus them the moment they turn, and seat checked-in reservations before new walk-ins.`,
    wait: () => `Reservations waited ${m.avgResWait} min on average${m.under ? ` and ${m.under} walk-in parties waited past their quote` : ''}. Seat from the table sheet as soon as a table turns red (needs clearing); tap Bus table yourself instead of waiting for the busser.`,
    quote: () => m.under >= m.over
      ? `You under-quoted ${m.under} of ${m.quoted} waitlist parties; they waited about ${m.avgUnder} min longer than promised. Count the similar-sized parties ahead of them and add 10 minutes when the room is over ${S().rushPct}% full.`
      : `You over-quoted ${m.over} of ${m.quoted} parties; they sat about ${m.avgOver} min sooner than told.${m.declined ? ` ${m.declined} part${m.declined === 1 ? 'y' : 'ies'} walked away from long quotes.` : ''} Quote what the floor will really deliver: check the Seated tab for tables close to turning.`,
    walkouts: () => `${m.walked} part${m.walked === 1 ? 'y' : 'ies'} (${m.walkedCovers} covers) walked out${m.ignored ? `, ${m.ignored} of them never got a quote` : ''}. Greet and quote every walk-in within two minutes, and check the Waitlist tab for red over-quote timers.`,
    eff: () => `Seat efficiency was ${m.eff}%.${bigWaste.length ? ` Examples: ${bigWaste.slice(0, 3).join(', ')}.` : ''} During a rush, save 6-tops and booths for parties of 4 or more; put 2s on two-tops or the bar.`,
    balance: () => { const s = m.secs.slice().sort((a, b) => b.covers / b.seats - a.covers / a.seats); return `${s[0].server} (${s[0].name}) took ${s[0].covers} covers while ${s[s.length - 1].server} (${s[s.length - 1].name}) had ${s[s.length - 1].covers}. Rotate: the next party goes to the server who was sat longest ago, and watch the cover counts above the tabs.`; },
    curve: () => { const bad = curve.filter(c => c.result === 'poor'); return `${m.curveGood} of ${m.curveTotal} curveballs went well.${bad.length ? ` Weakest: ${bad[0].title}${bad[0].note ? ' (' + bad[0].note.replace(/\.$/, '') + ')' : ''}.` : ''} Follow through after you promise something: move the table, or seat the guest at the table they asked for.`; },
    discipline: () => { const parts = Object.entries(m.overrides).map(([k, n]) => `${n} ${({ small: 'too-small tables', waste: 'wasted big tables', blocked: 'reserved-soon tables', overload: 'server overloads', unbussed: 'dirty tables', pref: 'ignored requests' })[k] || k}`); return `You seated past ${m.ovTotal} warnings (${parts.join(', ')}). Each one is a guest or a server who feels it later. When a warning pops up, try the no-warning options it suggests first.`; },
  };
  const ranked = Object.entries(comp).filter(([, c]) => c && c.score < 92).sort((a, b) => a[1].score - b[1].score);
  const tips = ranked.slice(0, 3).map(([k]) => ({ k, text: T[k]() }));
  const extra = [
    { k: 'x1', text: 'Practice a harder shift: Friday rush or Holiday at 10× speed with curveballs on High.' },
    { k: 'x2', text: 'Use Combine for big parties before you need it: pre-plan which tables you will push together when the 8-top arrives.' },
    { k: 'x3', text: 'Try turning off the turn timers in Settings so you have to read the table colors like on a real floor.' },
  ];
  while (tips.length < 3) tips.push(extra[tips.length]);
  return tips;
}

function scoreChart(H) {
  const W = 640, Ht = 200, pl = 34, pr = 16, pt = 14, pb = 26;
  const n = H.length;
  const x = i => n === 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (n - 1);
  const y = v => pt + (100 - v) / 100 * (Ht - pt - pb);
  const grid = [0, 25, 50, 75, 100].map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`).join('');
  const pts = H.map((h, i) => [x(i), y(h.score)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = n > 1 ? `<path class="area" d="${line} L${pts[n - 1][0]} ${y(0)} L${pts[0][0]} ${y(0)} Z"/>` : '';
  const dots = H.map((h, i) => `<g class="pt" tabindex="0" data-act="hist-open" data-id="${h.id}"><circle class="hit" cx="${pts[i][0]}" cy="${pts[i][1]}" r="14"/><circle class="dot${i === n - 1 ? ' end' : ''}" cx="${pts[i][0]}" cy="${pts[i][1]}" r="${i === n - 1 ? 5 : 4}"/><title>${esc((SHIFT_TYPES[h.type] || {}).name || h.type)} · ${fmtDate(h.date)} · ${h.grade} (${h.score})</title></g>`).join('');
  const lastLbl = `<text class="lbl" x="${pts[n - 1][0]}" y="${pts[n - 1][1] - 10}" text-anchor="${n > 1 ? 'end' : 'middle'}">${H[n - 1].score}</text>`;
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Score per shift, oldest to newest">${grid}${area}<path class="line" d="${line}"/>${dots}${lastLbl}<text class="ax" x="${pl}" y="${Ht - 6}">oldest</text><text class="ax" x="${W - pr}" y="${Ht - 6}" text-anchor="end">newest</text></svg></div>`;
}

  if (!SH || !SH.tutorial) return;
  const ev = SH.tutorial.ev;
  if (kind === 'seat' && data && data.id === SH.tutorial.patel) ev.seatPatel = true;
  if (kind === 'status' && data === 'check') ev.statuscheck = true;
  if (kind === 'bus') ev.bus = true;
  dirty();
}

function renderTutorial() {
  const el = $('#coach'); if (!el) return;
  if (!SH || !SH.tutorial || SH.ended || UI.view !== 'service') { setHTML(el, ''); return; }
  const T = SH.tutorial;
  let s = TUT_STEPS[T.step];
  if (s && s.check && s.check()) { T.step++; s = TUT_STEPS[T.step]; if (s && s.enter) s.enter(); saveSoon(); }
  if (!s) { setHTML(el, ''); return; }
  setHTML(el, `<div class="coach" role="status"><div class="coach-top"><span class="eyebrow">Tutorial · step ${T.step + 1} of ${TUT_STEPS.length}</span><button class="link" data-act="tut-skip">Skip</button></div>
    <p>${s.text}</p>${s.next ? `<button class="btn primary sm" data-act="tut-next">${s.next}</button>` : ''}</div>`);
}
ACT['tut-next'] = () => {
  const T = SH.tutorial; const s = TUT_STEPS[T.step];
  if (s && s.action) { s.action(); return; }
  T.step++; const n = TUT_STEPS[T.step]; if (n && n.enter) n.enter();
  dirty();
};
ACT['tut-skip'] = async () => {
  if (!(await askConfirm({ title: 'Skip the tutorial?', body: 'You can replay it any time from Help or the Service start screen.', ok: 'Skip' }))) return;
  DB.tutorialDone = true; SH = null; DB.shift = null; saveDB(); dirty();
};

/* ---------- boot ---------- */
function boot() {
  loadDB();
  $('#nav').innerHTML = [['service', 'service', 'Service'], ['editor', 'floor', 'Floor plan'], ['history', 'history', 'History'], ['settings', 'settings', 'Settings'], ['help', 'help', 'Help']]
    .map(([v, ic, l]) => `<button data-act="view" data-view="${v}" aria-label="${l}">${icon(ic)}<span>${l}</span></button>`).join('');
  applyTheme();
  $('#brand-venue').textContent = S().venue;
  if (DB.shift && !DB.shift.ended) {
    SH = DB.shift; SH.speed = 0;
    setTimeout(() => toast('Resumed your shift where you left off. The clock is paused.'), 300);
  }
  checkNarrow();
  window.addEventListener('resize', checkNarrow);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && SH && !SH.ended) { if (SH.speed > 0) { SH.prevSpeed = SH.speed; SH.speed = 0; SH.autoPaused = true; } DB.shift = SH; saveDB(); }
    else if (!document.hidden && SH && SH.autoPaused) { SH.autoPaused = false; toast('Clock paused while the app was in the background.'); dirty(); }
  });
  window.addEventListener('pagehide', () => { if (SH && !SH.ended) { DB.shift = SH; } saveDB(); });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select')) return;
    if (e.key === 'Escape') { if (sheet) closeSheet(); else if (selection) clearSelection(); }
    if (e.key === ' ' && SH && !SH.ended && UI.view === 'service') { e.preventDefault(); setSpeed(SH.speed ? 0 : (SH.prevSpeed || 1)); }
    if (e.key === 'Enter' && e.target.matches('[role=button]')) e.target.click();
  });
  showView('service');
  if (!DB.welcomed) {
    DB.welcomed = true; saveDB();
    openSheet(() => sheetHead(`Welcome to Covers`, `Host stand practice for ${esc(S().venue)}`) + `<div class="sheet-body"><p>Practice running the door: seat reservations and walk-ins, quote waits, manage table turns and handle curveballs on a simulated shift.</p><p>A sample floor plan is loaded. You can change it any time in <b>Floor plan</b>.</p></div><div class="sheet-foot"><button class="btn" data-act="close-sheet">Look around first</button><button class="btn primary" data-act="welcome-tut">Start the tutorial</button></div>`);
  }
  requestAnimationFrame(frame);
}
ACT['welcome-tut'] = () => { closeSheet(); ACT['start-tutorial'](); };
// test hook for automated checks
window.__covers = { get SH() { return SH; }, get DB() { return DB; }, simStep, estimateWait, busTable, commitAction, startShift, endShift, seatCheck, suggestUnits, attemptAction, beginSeat, quoteParty, resolveMsg, buildReport, P, allParties, renderNow, UI, ED };
boot();

})();
</script>
