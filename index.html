<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Covers Host Trainer</title>
<meta name="description" content="Practice running a restaurant host stand: floor plans, reservations, waitlist and simulated shifts.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Covers">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#8E2A3B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: app shell = header + full-height workspace; floor plan left, guest panel right (stacked on phones). */
:root {
  --bg: #F3F1F0; --surface: #FFFFFF; --surface-2: #F1EEEC; --ink: #1E1A1B; --ink-2: #4B4446; --muted: #7A7173;
  --line: #E2DCDA; --line-strong: #C9C0BE;
  --accent: #8E2A3B; --accent-ink: #FFFFFF; --accent-soft: #F6E6E8;
  --good: #23824A; --good-soft: #E1F2E7; --warn: #A86400; --warn-soft: #FBEFD9; --bad: #B4232F; --bad-soft: #FBE3E4;
  --floor: #FAF8F6; --floor-grid: #EFEBE8; --t-free: #FFFFFF; --t-stroke: #A99E9B; --chair: #DCD5D2; --chair-on: #5C5355; --bench: #CFC6C3;
  --wall: #5B5254; --block: #ECE7E4; --zone: rgba(120, 110, 100, .05);
  --st-reserved: #7B5BD6; --st-seated: #3A6FD8; --st-ordered: #0F9DAE; --st-mains: #3E9B3A; --st-dessert: #C24F9A;
  --st-check: #E58A1F; --st-paid: #5E6E86; --st-clearing: #CC3B3B; --st-ink: #FFFFFF; --st-ink-dark: #2A1A05;
  --shadow: 0 1px 2px rgba(30, 20, 20, .06), 0 6px 20px rgba(30, 20, 20, .08);
  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141213; --surface: #1E1B1C; --surface-2: #272324; --ink: #F1ECEA; --ink-2: #C9C1BF; --muted: #968D8B;
    --line: #342F30; --line-strong: #4A4344; --accent: #E37C8E; --accent-ink: #2A0B11; --accent-soft: #3A2026;
    --good: #5CC685; --good-soft: #193526; --warn: #F0B04A; --warn-soft: #3A2C14; --bad: #F2737C; --bad-soft: #3D1E21;
    --floor: #1A1718; --floor-grid: #221E1F; --t-free: #2A2627; --t-stroke: #6A6162; --chair: #3C3637; --chair-on: #D9D0CE; --bench: #3A3435;
    --wall: #8B8183; --block: #262223; --zone: rgba(255, 245, 240, .03);
    --st-reserved: #8F74E8; --st-seated: #4F86EA; --st-ordered: #1DB2C2; --st-mains: #4FB04A; --st-dessert: #D865AE;
    --st-check: #F09A35; --st-paid: #8796AE; --st-clearing: #E05252;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141213; --surface: #1E1B1C; --surface-2: #272324; --ink: #F1ECEA; --ink-2: #C9C1BF; --muted: #968D8B;
  --line: #342F30; --line-strong: #4A4344; --accent: #E37C8E; --accent-ink: #2A0B11; --accent-soft: #3A2026;
  --good: #5CC685; --good-soft: #193526; --warn: #F0B04A; --warn-soft: #3A2C14; --bad: #F2737C; --bad-soft: #3D1E21;
  --floor: #1A1718; --floor-grid: #221E1F; --t-free: #2A2627; --t-stroke: #6A6162; --chair: #3C3637; --chair-on: #D9D0CE; --bench: #3A3435;
  --wall: #8B8183; --block: #262223; --zone: rgba(255, 245, 240, .03);
  --st-reserved: #8F74E8; --st-seated: #4F86EA; --st-ordered: #1DB2C2; --st-mains: #4FB04A; --st-dessert: #D865AE;
  --st-check: #F09A35; --st-paid: #8796AE; --st-clearing: #E05252;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic { width: 20px; height: 20px; flex: none; vertical-align: middle; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; justify-content: center; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.ok-t { color: var(--good); } .bad-t { color: var(--bad); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .005em; }
h1 { font-size: 34px; font-weight: 700; line-height: 1.1; }
h2 { font-size: 20px; font-weight: 600; }
h3 { font-size: 18px; font-weight: 600; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.lede { color: var(--ink-2); font-size: 16.5px; max-width: 62ch; }

/* ----- shell ----- */
#app { display: flex; flex-direction: column; height: 100%; }
.top { flex: none; display: flex; align-items: center; gap: 12px; height: 54px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.brand .venue { color: var(--muted); font-size: 13px; padding-left: 9px; border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { margin-left: auto; display: flex; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 7px; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 14px; }
.nav button.on { background: var(--accent-soft); color: var(--accent); }
#views { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
#v-service, #v-editor { overflow: hidden; }
#v-service:has(.page) { overflow: auto; }
.page { max-width: 1000px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.page > h2 { margin-top: 12px; }

/* ----- buttons & controls ----- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 14.5px; white-space: nowrap; transition: background .12s, transform .06s; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.sm { min-height: 36px; padding: 0 11px; font-size: 13.5px; }
.btn.lg { min-height: 50px; padding: 0 22px; font-size: 16px; }
.btn.wide { flex: 1; }
.btn .ic { width: 18px; height: 18px; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); flex: none; }
.icon-btn:active { background: var(--surface-2); }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 2px; }
.seg.wrap { flex-wrap: wrap; }
.seg button { min-height: 36px; min-width: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; font-weight: 600; font-size: 13.5px; color: var(--ink-2); display: inline-grid; place-items: center; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg.speed button { font-family: var(--f-display); font-size: 15px; min-width: 42px; }
.seg.speed button.on { background: var(--accent); color: var(--accent-ink); }
.seg.sm button { min-height: 30px; font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 14px; }
.chip small { color: var(--muted); font-weight: 500; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip.lg { min-height: 44px; min-width: 52px; justify-content: center; font-family: var(--f-display); font-size: 17px; }
.chip.warnish { border-style: dashed; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.ok { background: var(--good-soft); color: var(--good); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill .ic { width: 14px; height: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > span { font-size: 12.5px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.field.inline { flex-direction: row; align-items: center; gap: 10px; }
.field.grow { flex: 1; min-width: 0; }
input[type=text], select, textarea { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font-size: 16px; }
select { appearance: auto; }
textarea { resize: vertical; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); overflow: hidden; }
.stepper button { width: 44px; height: 42px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); }
.stepper button:active { background: var(--surface-2); }
.stepper output { min-width: 46px; text-align: center; font-family: var(--f-display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper output small { font-size: 11px; color: var(--muted); margin-left: 2px; font-family: var(--f-body); }
.stepper.sm button { width: 34px; height: 34px; } .stepper.sm output { min-width: 30px; font-size: 16px; }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle span { width: 46px; height: 28px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .15s; flex: none; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s; }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(18px); }
.toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.empty { padding: 18px 16px; color: var(--muted); font-size: 14px; }
.empty.big { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 28px 0; }
.empty.big .ic { width: 36px; height: 36px; }
.callout { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); flex-wrap: wrap; }
.callout > div { flex: 1; min-width: 200px; }
.callout > .ic { color: var(--accent); width: 26px; height: 26px; }

/* status swatches (html) */
.sw, .stchip { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; flex: none; }
.stchip { width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.st-available.sw, .st-available.stchip { background: var(--t-free); box-shadow: inset 0 0 0 1.5px var(--t-stroke); }
.st-reserved.sw, .st-reserved.stchip { background: var(--t-free); box-shadow: inset 0 0 0 3px var(--st-reserved); }
.st-seated.sw, .st-seated.stchip { background: var(--st-seated); }
.st-ordered.sw, .st-ordered.stchip { background: var(--st-ordered); }
.st-mains.sw, .st-mains.stchip { background: var(--st-mains); }
.st-dessert.sw, .st-dessert.stchip { background: var(--st-dessert); }
.st-check.sw, .st-check.stchip { background: var(--st-check); }
.st-paid.sw, .st-paid.stchip { background: var(--st-paid); }
.st-clearing.sw, .st-clearing.stchip { background: repeating-linear-gradient(45deg, var(--st-clearing) 0 3px, color-mix(in srgb, var(--st-clearing) 60%, #000) 3px 5px); }

/* ----- service layout ----- */
.svc { display: flex; flex-direction: column; height: 100%; }
.shiftbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); min-height: 56px; }
.clock { display: flex; align-items: baseline; gap: 3px; font-family: var(--f-display); font-variant-numeric: tabular-nums; min-width: 70px; }
.clock #ck { font-size: 28px; font-weight: 700; line-height: 1; }
.clock .ap { font-size: 14px; color: var(--muted); font-weight: 600; }
.kpis { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.kpi b { color: var(--ink); font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums; margin-right: 2px; }
.kpi.warn { color: var(--warn); display: inline-flex; gap: 4px; align-items: center; font-weight: 600; }
.kpi .ic { width: 16px; height: 16px; }
.sb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.shift-name { font-size: 13px; color: var(--muted); font-weight: 600; }
.svc-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 390px; }
.floor-wrap { position: relative; min-width: 0; min-height: 0; background: var(--floor); background-image: radial-gradient(var(--floor-grid) 1.2px, transparent 1.3px); background-size: 22px 22px; overflow: hidden; }
svg.floor { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.floor-tools { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 3px; }
.floor-mode { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 10px; box-shadow: var(--shadow); background: var(--surface); border-radius: 11px; }
.panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); border-left: 1px solid var(--line); }
.panel-handle { display: none; }
.secstrip { flex: none; display: flex; gap: 6px; padding: 10px 12px 8px; overflow-x: auto; scrollbar-width: none; }
.secstrip::-webkit-scrollbar { display: none; }
.secchip { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; white-space: nowrap; flex: none; }
.secchip .sv { font-weight: 600; }
.secchip .cv { color: var(--muted); font-variant-numeric: tabular-nums; }
.secchip .cv b { color: var(--ink); font-family: var(--f-display); font-size: 15px; }
.secchip.onbreak { opacity: .65; }
.secchip .ic { width: 15px; height: 15px; color: var(--warn); }
.tabs { flex: none; display: flex; border-bottom: 1px solid var(--line); padding: 0 6px; }
.tabs button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; border: 0; background: none; font-weight: 700; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 0 4px; position: relative; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .cnt { font-family: var(--f-display); font-size: 14px; background: var(--surface-2); border-radius: 999px; padding: 0 7px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tabs .badge { position: absolute; top: 3px; right: 4px; font-size: 10.5px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 6px; line-height: 17px; }
.plist { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 8px; }
.ghead { display: flex; align-items: center; gap: 6px; width: 100%; padding: 12px 14px 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); border: 0; background: none; text-align: left; }
.ghead.tgl { min-height: 40px; }
.ghead .ic { width: 16px; height: 16px; }
.prow { display: grid; grid-template-columns: 26px 46px minmax(0, 1fr) auto auto 36px; align-items: center; gap: 6px; min-height: 58px; padding: 6px 4px 6px 4px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; -webkit-user-select: none; }
.prow:active { background: var(--surface-2); }
.prow.selected { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.prow.is-done { opacity: .62; }
.grip { display: grid; place-items: center; height: 44px; color: var(--muted); touch-action: none; cursor: grab; }
.grip .ic { width: 18px; height: 18px; }
.ptime { font-family: var(--f-display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.is-here .ptime { color: var(--accent); }
.pmain { min-width: 0; }
.pname { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.psub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.psize { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.pright { display: flex; justify-content: flex-end; }
.pmore { width: 36px; height: 40px; }
.tag { display: inline-grid; color: var(--accent); }
.tag .ic { width: 14px; height: 14px; }
.tag-allergy { color: var(--good); } .tag-vip { color: var(--warn); }
.qbar { position: relative; width: 64px; height: 6px; border-radius: 3px; background: var(--surface-2); flex: none; overflow: visible; }
.qbar > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); border-radius: 3px; }
.qbar.over > span { background: var(--bad); }
.qbar > i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); }
.qtxt { overflow: hidden; text-overflow: ellipsis; }
.panel-foot { flex: none; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.panel-foot .btn { flex: 1; }

/* selection bar + coach */
#selbar, #ed-mode { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 5; pointer-events: none; }
#coach { flex: none; }
#coach:not(:empty) { padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.selbar, .coach { pointer-events: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; border: 1px solid var(--line); }
.sb-text { display: flex; gap: 10px; align-items: center; flex: 1 1 260px; min-width: 0; }
.sb-text .ic { color: var(--accent); width: 24px; height: 24px; }
.sb-text b { font-size: 15.5px; }
.sb-text .muted { font-size: 13.5px; }
.sb-sugg { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; flex: 1 1 auto; }
.sb-btns { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.coach { flex-direction: row; align-items: center; border-color: var(--accent); box-shadow: none; padding: 8px 12px; }
.coach p { margin: 0; font-size: 15px; flex: 1 1 260px; }
.coach .btn { margin-left: auto; }
.coach-top { display: flex; justify-content: space-between; align-items: center; flex-basis: 100%; }

/* ----- floor svg ----- */
.tb { cursor: pointer; }
.tb .body { fill: var(--t-free); stroke: var(--t-stroke); stroke-width: 1.5; transition: fill .3s; }
.tb .bench { fill: var(--bench); }
.tb .chair { fill: var(--chair); }
.tb .chair.on { fill: var(--chair-on); }
.tb .secdot { stroke: var(--surface); stroke-width: 1.5; }
.tb text { text-anchor: middle; dominant-baseline: middle; fill: var(--ink); font-family: var(--f-display); pointer-events: none; font-variant-numeric: tabular-nums; }
.tb .tn { font-weight: 700; }
.tb .tp { font-weight: 600; font-family: var(--f-body); }
.tb .tl { font-weight: 500; }
.tb .tc { fill: var(--muted); font-weight: 500; }
.tb .over { font-weight: 800; text-decoration: underline; }
.tb.st-reserved .body { stroke: var(--st-reserved); stroke-width: 4; }
.tb.st-reserved .tl { fill: var(--st-reserved); font-weight: 700; }
.tb.st-seated .body { fill: var(--st-seated); stroke: none; }
.tb.st-ordered .body { fill: var(--st-ordered); stroke: none; }
.tb.st-mains .body { fill: var(--st-mains); stroke: none; }
.tb.st-dessert .body { fill: var(--st-dessert); stroke: none; }
.tb.st-check .body { fill: var(--st-check); stroke: none; }
.tb.st-paid .body { fill: var(--st-paid); stroke: none; }
.tb.st-clearing .body { fill: url(#hatch); stroke: var(--st-clearing); stroke-width: 2; }
.tb.st-seated text, .tb.st-ordered text, .tb.st-mains text, .tb.st-dessert text, .tb.st-paid text, .tb.st-clearing text { fill: var(--st-ink); }
.tb.st-check text { fill: var(--st-ink-dark); }
.tb.secmode .body { stroke: var(--surface); stroke-width: 2; }
.tb.secmode text { fill: #fff; }
.pref-star path { fill: var(--warn); stroke: var(--surface); stroke-width: 2; }
.tb.sel-good .body { stroke: var(--good); stroke-width: 5; stroke-dasharray: none; }
.tb.sel-good { animation: pulse 1.4s ease-in-out infinite; }
.tb.sel-warn .body { stroke: var(--warn); stroke-width: 4; stroke-dasharray: 7 5; }
.tb.sel-no { opacity: .33; }
.tb.sel-picked .body { stroke: var(--accent); stroke-width: 6; stroke-dasharray: none; }
.tb.sel-self .body { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 3 3; }
.tb.drop .body { stroke: var(--accent); stroke-width: 7; }
@keyframes pulse { 50% { opacity: .72; } }
@media (prefers-reduced-motion: reduce) { .tb.sel-good { animation: none; } .sheet.enter { animation: none !important; } .toast { transition: none; } }
.decor-it .wall { fill: var(--wall); }
.decor-it .block { fill: var(--block); stroke: var(--line-strong); stroke-width: 1; }
.decor-it .zone { fill: var(--zone); stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 9 7; }
.decor-it .lbl-hit { fill: transparent; }
.decor-it .dtext { text-anchor: middle; dominant-baseline: middle; fill: var(--muted); font-family: var(--f-display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; pointer-events: none; }
.floor:not(.editing) .decor { pointer-events: none; }
.editing .tb .body { stroke: rgba(0, 0, 0, .18); stroke-width: 1; fill-opacity: .92; }
.editing .tb text { fill: #fff; }
.editing .tb .tc { fill: rgba(255, 255, 255, .85); }
.editing .tb.sel .body { stroke: var(--ink); stroke-width: 3; }
.editing .tb.in-combo .body { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
.editing .tb.sel-picked .body { stroke: var(--accent); stroke-width: 6; stroke-dasharray: none; }
.editing .decor-it { cursor: move; }
.editing .decor-it.sel rect { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: none; }
.handles line { stroke: var(--accent); }
.handles circle { fill: var(--surface); stroke: var(--accent); cursor: grab; }
.handles .h-rotate { fill: var(--accent); }

/* ----- sheets, dialogs, messages, toasts ----- */
#sheet-layer, #confirm-layer, #msg-layer { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
#confirm-layer { z-index: 40; }
#msg-layer { z-index: 25; pointer-events: none; }
.scrim { position: absolute; inset: 0; background: rgba(15, 8, 10, .42); }
.scrim.soft { background: rgba(15, 8, 10, .22); pointer-events: auto; }
.sheet { position: relative; width: min(540px, 100%); max-height: min(86vh, 860px); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.sheet.wide { width: min(1000px, 100%); }
.sheet.wide .page { padding-block: 20px 24px; overflow-y: auto; min-height: 0; }
.sheet.enter { animation: rise .18s ease-out; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 16px 12px 8px 20px; }
.sheet-head h2 { font-size: 23px; }
.sheet-head .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.sheet-body { padding: 4px 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
.sheet-body > p { margin: 0; }
.sheet-foot { display: flex; gap: 10px; padding: 12px 20px; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); justify-content: flex-end; }
.sheet-foot.wrap { flex-wrap: wrap; }
.sheet-foot .btn { flex: 1 1 auto; }
.dialog { position: relative; width: min(420px, 100%); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.dialog p { margin: 0; color: var(--ink-2); }
.dialog .row-btns { justify-content: flex-end; }
.msg { position: relative; pointer-events: auto; width: min(460px, 100%); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 18px; border-top: 5px solid var(--warn); display: flex; flex-direction: column; gap: 8px; animation: rise .2s ease-out; }
.msg h3 { font-size: 21px; }
.msg p { margin: 0; color: var(--ink-2); }
.msg-top { display: flex; align-items: center; gap: 8px; }
.msg-ic { width: 30px; height: 30px; border-radius: 50%; background: var(--warn-soft); color: var(--warn); display: grid; place-items: center; }
.msg-ic .ic { width: 18px; height: 18px; }
.msg-kicker { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
.msg-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.msg-opts .btn { justify-content: flex-start; text-align: left; white-space: normal; padding: 10px 14px; }
#toasts { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; flex-direction: column; gap: 6px; width: min(400px, calc(100% - 32px)); pointer-events: none; }
@media (max-width: 899px) { #toasts { bottom: auto; top: calc(5px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); } .toast { padding: 8px 12px; font-size: 13.5px; } }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); transition: opacity .3s, transform .3s; pointer-events: none; border-left: 5px solid var(--muted); }
.toast.t-good { border-left-color: var(--good); } .toast.t-warn { border-left-color: var(--warn); } .toast.t-bad { border-left-color: var(--bad); }
.toast.has-act { cursor: pointer; pointer-events: auto; }
.toast.out { opacity: 0; transform: translateY(6px); }
#drag-ghost { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow); white-space: nowrap; }

/* sheet content */
.pcard { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: var(--surface-2); border-radius: var(--r); }
.pc-name { font-weight: 700; font-size: 17px; display: flex; gap: 6px; align-items: center; }
.pc-meta { font-size: 14px; color: var(--ink-2); }
.note { font-size: 13.5px; background: var(--warn-soft); color: var(--ink); padding: 6px 10px; border-radius: 8px; margin-top: 4px; }
.stgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.stbtn { display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 14px; text-align: left; }
.stbtn.on { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.actgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.pick { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; }
.pick span { color: var(--muted); font-size: 13.5px; }
.pick + .pick { margin-top: -6px; }
.quickrow, .quotes { display: flex; gap: 8px; flex-wrap: wrap; }
.hold { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--st-reserved) 14%, var(--surface)); font-size: 14px; }
.hold .ic { color: var(--st-reserved); }
.hint { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink-2); background: var(--surface-2); padding: 10px 12px; border-radius: 10px; }
.warns { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.warns li { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); }
.warns li .ic { color: var(--warn); margin-top: 1px; }
.warns li div { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.alt { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; }
.tagpill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 600; border: 1px solid transparent; }
.tagpill .ic { width: 15px; height: 15px; }
button.tagpill { min-height: 36px; }
.tagpill.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 16px; }
.lg { display: grid; grid-template-columns: 18px auto; column-gap: 8px; align-items: center; }
.lg span:last-child { grid-column: 2; color: var(--muted); font-size: 13px; }

/* ----- start screen ----- */
.start-hero { display: flex; flex-direction: column; gap: 10px; }
.start-hero h1 { font-size: 44px; }
.start-hero .lede { margin: 0; }
.shift-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; }
.shift-card { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; min-height: 150px; }
.shift-card.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sc-name { font-family: var(--f-display); font-size: 21px; font-weight: 700; }
.sc-time { font-size: 13px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.sc-blurb { font-size: 13.5px; color: var(--ink-2); flex: 1; }
.sc-meter { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.sc-meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.start-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 14px; background: var(--surface); border-radius: 14px; border: 1px solid var(--line); }
.start-row .field { flex: 1 1 260px; }
.start-row select { min-width: 0; }
.start-foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.last-card { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; color: var(--ink-2); text-align: left; flex-wrap: wrap; }

/* ----- report ----- */
.rep-head { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.rep-title { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 6px; }
.rep-title .lede { margin: 0; }
.grade-block { width: 120px; height: 120px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; flex: none; }
.grade-l { font-family: var(--f-display); font-size: 64px; font-weight: 700; line-height: 1; }
.grade-s { font-size: 14px; font-weight: 600; opacity: .9; font-variant-numeric: tabular-nums; }
.g-A { background: #23824A; } .g-B { background: #2F6FB3; } .g-C { background: #A86E00; } .g-D { background: #C2561D; } .g-F { background: #B4232F; }
b.grade, .grade { display: inline-grid; place-items: center; min-width: 40px; height: 34px; padding: 0 6px; border-radius: 9px; color: #fff; font-family: var(--f-display); font-size: 19px; }
.grade-block.grade { display: flex; }
.rep-cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; }
.rep-main, .rep-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tips { margin: 0; padding: 0; list-style: none; counter-reset: t; display: flex; flex-direction: column; gap: 10px; }
.tips li { counter-increment: t; display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 12px 14px; background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); font-size: 15px; }
.tips li::before { content: counter(t); width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.scorecard { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); }
.sc-row { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.sc-row:last-child { border-bottom: 0; }
.sc-ic { color: var(--muted); padding-top: 2px; }
.sc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.sc-top { display: flex; justify-content: space-between; }
.sc-val { font-family: var(--f-display); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sc-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.sc-bar i { display: block; height: 100%; border-radius: 3px; }
.sc-bar i.ok { background: var(--good); } .sc-bar i.warn { background: var(--warn); } .sc-bar i.bad { background: var(--bad); }
.sc-detail { font-size: 13px; color: var(--muted); }
.nums { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.nums div { background: var(--surface); padding: 10px 12px; }
.nums dt { font-size: 12px; color: var(--muted); }
.nums dd { margin: 2px 0 0; font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nums dd small { font-size: 13px; color: var(--muted); font-weight: 500; font-family: var(--f-body); }
.secbars { display: flex; flex-direction: column; gap: 8px; }
.secbar { display: grid; grid-template-columns: 90px 1fr 34px; gap: 8px; align-items: center; font-size: 13.5px; }
.sb-n { display: flex; gap: 6px; align-items: center; overflow: hidden; white-space: nowrap; }
.sb-track { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.sb-track i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.sb-v { text-align: right; font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.cblist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.cblist li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.cblist li > span:last-child { display: flex; flex-direction: column; }
.cblist small { color: var(--muted); }

/* ----- history ----- */
.hist-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.hist-sum > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.hist-sum b { font-family: var(--f-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.hist-sum b small { font-size: 15px; color: var(--muted); }
.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.chart-title { font-weight: 700; margin-bottom: 6px; display: flex; gap: 8px; align-items: baseline; }
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 320px; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .1; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .pt:hover .dot, .chart .pt:focus .dot { r: 7; }
.chart .lbl { fill: var(--ink); font-size: 13px; font-weight: 700; font-family: var(--f-display); }
.hist-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.hist-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.hist-row:last-child { border-bottom: 0; }
.hr-main { display: flex; flex-direction: column; min-width: 0; }
.hr-num { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }

/* ----- settings / help ----- */
.set-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.set-group > p { margin: 0 0 6px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.set-group h2 + .set-row, .set-group p + .set-row { border-top: 0; }
.set-l { display: flex; flex-direction: column; flex: 1 1 200px; }
.set-c input[type=text] { width: 220px; max-width: 100%; }
.help-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.help-grid section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.help-grid p { font-size: 14.5px; color: var(--ink-2); margin: 8px 0 0; }
.help p, .help li { max-width: 70ch; }
.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* ----- editor ----- */
.ed-bar { gap: 8px; flex-wrap: nowrap; overflow-x: auto; }
.ed-bar .field.inline span { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ed-bar select { min-height: 38px; font-size: 15px; min-width: 120px; }
.ed-bar .field.grow { min-width: 120px; }
.ed-sec, .props { padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.ed-sec .ghead { padding-left: 0; }
.addgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.addbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; font-weight: 600; }
.addbtn .ic { width: 26px; height: 26px; color: var(--ink-2); }
.props-head { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; }
.secrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 4px 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.secrow > .muted { grid-column: 2; grid-row: 2; }
.secrow > .icon-btn:nth-of-type(1) { grid-column: 3; grid-row: 1 / span 2; }
.secrow > .icon-btn:nth-of-type(2) { grid-column: 4; grid-row: 1 / span 2; }
.secrow input[type=color] { width: 40px; height: 40px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 2px; background: var(--surface); grid-row: 1 / span 2; }
.secfields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.secfields input { min-height: 38px; font-size: 15px; }
.combrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.combrow b { flex: 1 1 100px; }
.cmb-steps { display: flex; align-items: center; gap: 6px; }

/* ----- responsive ----- */
.hide-sm { }
@media (max-width: 899px) {
  .svc-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) var(--ph, 46%); }
  .svc[data-panel="min"] { --ph: 104px; }
  .svc[data-panel="half"] { --ph: 46%; }
  .svc[data-panel="full"] { --ph: 80%; }
  .panel { border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -6px 18px rgba(0, 0, 0, .08); position: relative; z-index: 3; }

  min = Math.floor(min);

  const m = ((min % 60) + 60) % 60;
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return h + ':' + String(m).padStart(2, '0') + ap;
}
function fmtClock(min) { // with seconds-free compact form "7:05"
  min = Math.floor(min);

  h = h % 12 || 12;
  return h + ':' + String(m).padStart(2, '0');
}
function fmtDur(m) {
  m = Math.round(m);
  const neg = m < 0; m = Math.abs(m);
  const s = m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');

/* Seeded random so a shift can be replayed */
function makeRng(seed) {
  let a = seed >>> 0;
  const r = () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    r,
    range: (a, b) => a + r() * (b - a),
    int: (a, b) => Math.floor(a + r() * (b - a + 1)),
    pick: arr => arr[Math.floor(r() * arr.length)],
    chance: p => r() < p,
    normal(mean, sd) {
      const u = 1 - r(), v = r();
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },
    weighted(pairs) { // [[value, weight], ...]
      const tot = sum(pairs, p => p[1]);
      let x = r() * tot;
      for (const [v, w] of pairs) { if ((x -= w) <= 0) return v; }
      return pairs[pairs.length - 1][0];
    },
    poisson(l) {
      if (l <= 0) return 0;
      const L = Math.exp(-l); let k = 0, p = 1;
      do { k++; p *= r(); } while (p > L);
      return k - 1;
    }
  };
}

function lerpCurve(points, x) { // points [[x,y]...] sorted
  if (x <= points[0][0]) return points[0][1];
  for (let i = 1; i < points.length; i++) {
    if (x <= points[i][0]) {
      const [x0, y0] = points[i - 1], [x1, y1] = points[i];
      return y0 + (y1 - y0) * (x - x0) / (x1 - x0);

  }
  return points[points.length - 1][1];
}

/* ---------- persistence (localStorage) ---------- */
const STORE_KEY = 'covers.host.v1';
let DB = null;

function defaultDB() {
  const lay = sampleLayout();
  return { v: 1, layouts: [lay], activeLayoutId: lay.id, settings: ROOT_SETTINGS(), history: [], tutorialDone: false, welcomed: false, shift: null, lastShiftType: 'normal' };
}

function mergeSettings(s) {
  const d = ROOT_SETTINGS();
  const out = Object.assign(d, s || {});
  out.turn = Object.assign(ROOT_SETTINGS().turn, (s && s.turn) || {});
  return out;
}

function loadDB() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.layouts)) {
        DB = Object.assign(defaultDB(), d);
        DB.settings = mergeSettings(d.settings);
        if (!DB.layouts.length) { const l = sampleLayout(); DB.layouts.push(l); DB.activeLayoutId = l.id; }
        if (!DB.layouts.find(l => l.id === DB.activeLayoutId)) DB.activeLayoutId = DB.layouts[0].id;
        return;
      }
    }
  } catch (e) { console.warn('load failed', e); }
  DB = defaultDB();
}

let saveFailedOnce = false;
function saveDB() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(DB));
  } catch (e) {
    if (!saveFailedOnce) { saveFailedOnce = true; toast('This browser is not letting the app save. Your work will be lost when you close the tab.', 'warn'); }
  }
}

function activeLayout() { return DB.layouts.find(l => l.id === DB.activeLayoutId) || DB.layouts[0]; }
const S = () => DB.settings;

/* ---------- shift model helpers: capacity, status, turn times, warnings ---------- */
let SH = null; // the live shift (persisted as DB.shift)

const tableById = (lay, id) => lay.tables.find(t => t.id === id);
const sectionById = (lay, id) => lay.sections.find(s => s.id === id);
const P = id => SH && SH.parties[id];
const allParties = () => SH ? SH.order.map(id => SH.parties[id]) : [];
const tName = id => { const t = SH && tableById(SH.layout, id); return t ? t.name : '?'; };
const tNames = ids => (ids || []).map(tName).join('+');

function sizeBucket(n) { return n <= 2 ? 's2' : n <= 4 ? 's4' : n <= 6 ? 's6' : 's8'; }
function expectedTurn(size) {
  const st = SHIFT_TYPES[SH ? SH.type : 'normal'];
  return S().turn[sizeBucket(size)] * (st ? st.turnMul : 1);
}

function combosOf(lay) { return lay.combos || []; }
function sameSet(a, b) { return a.length === b.length && a.every(x => b.includes(x)); }

function capacityOf(lay, tids) {
  if (!tids.length) return { min: 0, max: 0, combo: null };
  if (tids.length === 1) { const t = tableById(lay, tids[0]); return t ? { min: t.min, max: t.max, combo: null } : { min: 0, max: 0 }; }
  const c = combosOf(lay).find(c => sameSet(c.tableIds, tids));
  if (c) return { min: c.min, max: c.max, combo: c };
  const ts = tids.map(id => tableById(lay, id)).filter(Boolean);
  return { min: Math.max(...ts.map(t => t.min)), max: sum(ts, t => t.max), combo: null, adhoc: true };
}

// every seatable unit: each table plus each defined combination
function seatUnits(lay) {
  const u = lay.tables.map(t => ({ ids: [t.id], min: t.min, max: t.max, bar: t.shape === 'bar', label: t.name }));
  for (const c of combosOf(lay)) {
    const ts = c.tableIds.map(id => tableById(lay, id)).filter(Boolean);
    if (ts.length !== c.tableIds.length || ts.length < 2) continue;
    u.push({ ids: c.tableIds.slice(), min: c.min, max: c.max, bar: ts.every(t => t.shape === 'bar'), combo: true, label: ts.map(t => t.name).join('+') });
  }
  return u;
}

function tableSeats(lay) { return sum(lay.tables, t => t.max); }

/* ----- live status ----- */
function tableIsFree(tid) { const s = SH.tables[tid]; return s && s.state === 'free'; }
function tableHold(tid, horizon) {
  // next booked reservation assigned to this table that is not seated yet
  let best = null;
  for (const p of allParties()) {
    if (p.kind !== 'res' || !(p.status === 'booked' || p.status === 'arrived')) continue;
    if (!p.assigned || !p.assigned.includes(tid)) continue;
    if (p.resTime - SH.clock > horizon) continue;
    if (!best || p.resTime < best.resTime) best = p;
  }
  return best;
}
function tableStatus(tid) {
  const s = SH.tables[tid];
  if (!s) return 'available';
  if (s.state === 'occ') { const p = P(s.pid); return p ? p.phase : 'seated'; }
  if (s.state === 'clearing') return 'clearing';
  return tableHold(tid, S().heldWindow) ? 'reserved' : 'available';
}

function phaseDur(p, phase) {
  let d = p.turn * PHASE_SHARE[phase];
  if ((phase === 'ordered' || phase === 'mains') && SH.kitchen && SH.clock < SH.kitchen.until) d *= SH.kitchen.factor;
  if (phase === 'paid' && p.hidden && p.hidden.camp) d += p.hidden.camp;
  return d;
}
function minutesLeft(p) {
  if (p.status !== 'seated') return 0;
  const i = PHASES.indexOf(p.phase);
  let m = Math.max(0, p.phaseEnd - SH.clock);
  for (let j = i + 1; j < PHASES.length; j++) m += p.turn * PHASE_SHARE[PHASES[j]];
  return m;
}
function expectedFreeAt(tid) {
  const s = SH.tables[tid];
  if (!s || s.state === 'free') return SH.clock;
  if (s.state === 'clearing') return SH.clock + Math.max(1, S().autoBus || 3);
  const p = P(s.pid);
  return SH.clock + (p ? minutesLeft(p) : 30) + 3;
}

function occupancy() {
  const tabs = SH.layout.tables;
  if (!tabs.length) return 0;
  const seats = sum(tabs, t => t.max);
  const used = sum(tabs.filter(t => SH.tables[t.id] && SH.tables[t.id].state !== 'free'), t => t.max);
  return seats ? used / seats : 0;
}
function waitingParties() {
  return allParties().filter(p => p.status === 'waiting' || p.status === 'new' || p.status === 'arrived');
}
function isRush() {
  return occupancy() * 100 >= S().rushPct || waitingParties().length >= 3;
}

function sectionLoad() {
  // current covers and total covers seated per section
  const out = {};
  for (const s of SH.layout.sections) out[s.id] = { now: 0, total: 0, tables: 0, seats: 0 };
  for (const t of SH.layout.tables) {
    if (!out[t.sectionId]) continue;
    out[t.sectionId].tables++; out[t.sectionId].seats += t.max;
  }
  for (const p of allParties()) {
    if (!p.seatedAt || !p.sectionId || !out[p.sectionId]) continue;
    out[p.sectionId].total += p.size;
    if (p.status === 'seated') out[p.sectionId].now += p.size;
  }
  return out;
}
function sectionIsBar(lay, secId) {
  const ts = lay.tables.filter(t => t.sectionId === secId);
  return ts.length > 0 && ts.every(t => t.shape === 'bar');
}
function primarySection(tids) {
  const t = tableById(SH.layout, tids[0]);
  return t ? t.sectionId : null;
}
function serverOnBreak(secId) {
  const b = SH.breaks && SH.breaks[secId];
  return b && SH.clock >= b.from && SH.clock < b.until;
}

/* ----- seating checks (the host's guard rails) ----- */
function seatCheck(p, tids, mode = 'seat') {
  const lay = SH.layout;
  const out = { block: null, warns: [] };
  if (!tids.length) { out.block = 'Pick a table.'; return out; }
  for (const id of tids) {
    const st = SH.tables[id];
    if (st && st.state === 'occ' && st.pid !== p.id) { out.block = `Table ${tName(id)} already has a party.`; return out; }
  }
  if (tids.length > 1) {
    const ts = tids.map(id => tableById(lay, id));
    const c = capacityOf(lay, tids);
    if (!c.combo && ts.some(t => !t.combinable)) { out.block = `Table ${ts.find(t => !t.combinable).name} is not set as combinable.`; return out; }
  }
  const cap = capacityOf(lay, tids);
  const size = p.size;
  const unbussed = tids.filter(id => SH.tables[id] && SH.tables[id].state === 'clearing');
  if (unbussed.length) out.warns.push({ type: 'unbussed', text: `Table ${tNames(unbussed)} hasn't been bussed yet. Seating it now means guests sit at a dirty table (it will be cleared as you seat).` });
  if (size > cap.max) out.warns.push({ type: 'small', text: `Too small: ${tNames(tids)} seats up to ${cap.max}, this party is ${size}.` });
  else if (size < cap.min) out.warns.push({ type: 'waste', text: `${tNames(tids)} is set for ${cap.min}–${cap.max}. A party of ${size} is under the minimum.` });
  else if (isRush() && cap.max - size >= 3) out.warns.push({ type: 'waste', text: `It's busy and ${tNames(tids)} seats ${cap.max}. Putting ${size} here leaves ${cap.max - size} empty seats a bigger party could use.` });
  // reservation hold
  const turn = expectedTurn(size);
  for (const id of tids) {
    const h = tableHold(id, Math.max(S().heldWindow, turn - 5));
    if (h && h.id !== p.id) {
      const freeBy = SH.clock + turn;
      out.warns.push({ type: 'blocked', text: `Table ${tName(id)} is held for ${h.name} (${h.size}) at ${fmtTime(h.resTime)}. This party will likely be there until about ${fmtTime(freeBy)}.` });
    }
  }
  // server balance
  const sec = primarySection(tids);
  if (sec) {
    const s = sectionById(lay, sec);
    if (serverOnBreak(sec)) out.warns.push({ type: 'overload', text: `${s.server || s.name} is on break. Nobody will greet this table for a while.` });
    // double seats are normal in a rush; triple seats never are
    const recent = (SH.stats.seatings || []).filter(x => x.sec === sec && SH.clock - x.t <= S().doubleSeatMin && x.pid !== p.id);
    if (mode !== 'move' && (recent.length >= 2 || (recent.length === 1 && !isRush())))
      out.warns.push({ type: 'overload', text: `${s.server || s.name} (${s.name}) was just sat ${Math.round(SH.clock - recent[recent.length - 1].t)} min ago. Seating now is a ${recent.length >= 2 ? 'triple' : 'double'} seat${recent.length === 1 ? ' on a quiet floor; another server is free' : ''}.` });
    // compare this server's covers with their fair share of what is on the floor right now
    const load = sectionLoad();
    const live = lay.sections.filter(x => load[x.id] && load[x.id].seats > 0 && !serverOnBreak(x.id) && !sectionIsBar(lay, x.id));
    if (live.length > 1 && live.some(x => x.id === sec)) {
      const add = mode === 'move' ? 0 : size;
      const totNow = sum(live, x => load[x.id].now) + add;
      const totSeats = sum(live, x => load[x.id].seats);
      const fair = totNow * load[sec].seats / totSeats;
      const mine = load[sec].now + add;
      if (mine - fair > S().overload) out.warns.push({ type: 'overload', text: `${s.server || s.name} would have ${mine} covers on the floor. Their fair share right now is about ${Math.round(fair)}.` });
    }
  }
  if (p.prefTable && !tids.includes(p.prefTable)) out.warns.push({ type: 'pref', text: `${p.name} asked for table ${tName(p.prefTable)}.` });
  return out;
}

// best options for a party, used for suggestion chips and highlight
function suggestUnits(p, limit = 4) {
  const lay = SH.layout;
  const res = [];
  for (const u of seatUnits(lay)) {
    if (u.max < p.size) continue;
    if (!u.ids.every(id => SH.tables[id] && SH.tables[id].state === 'free')) continue;
    if (u.bar && p.size > 2) continue;
    const chk = seatCheck(p, u.ids);
    if (chk.block) continue;
    let score = (u.max - p.size) * 3 + (u.ids.length - 1) * 2 + chk.warns.length * 6;
    if (p.size < u.min) score += 5;
    if (p.assigned && sameSet(p.assigned, u.ids)) score -= 8;
    if (p.prefTable && u.ids.includes(p.prefTable)) score -= 10;
    if (u.bar) score += 4;
    res.push({ ids: u.ids, label: u.label, score, warns: chk.warns.length, max: u.max });
  }
  res.sort((a, b) => a.score - b.score);
  return res.slice(0, limit);
}

function partyWaitStart(p) {
  if (p.kind === 'res') return Math.max(p.resTime, p.arrivedAt != null ? p.arrivedAt : p.resTime);
  return p.addedAt;
}
function partyWaited(p) {
  const end = p.seatedAt != null ? p.seatedAt : SH.clock;
  return Math.max(0, end - partyWaitStart(p));
}

/* ---------- shift generation and simulation ---------- */
function partyName(rng) { return rng.pick(LAST) + ', ' + rng.pick(FIRST); }
function shortName(p) { return p.name.split(',')[0]; }

function newParty(o) {
  return Object.assign({
    id: uid('p'), kind: 'walk', name: 'Walk-in', size: 2, origSize: 2, tags: [], note: '',
    resTime: null, assigned: null, status: 'new', arriveTime: null, arrivedAt: null, addedAt: null, quote: null,
    seatedAt: null, tableIds: [], phase: null, phaseEnd: null, turn: 0, leftAt: null, outcome: null, sectionId: null,
    hidden: {}, flags: {}, prefTable: null, manual: false,
  }, o);
}

function addParty(p) { SH.parties[p.id] = p; SH.order.push(p.id); return p; }

function buildBook(lay, st, rng) {
  const out = [];
  const units = seatUnits(lay).filter(u => !u.bar);
  const nonBar = lay.tables.filter(t => t.shape !== 'bar').length || 1;
  const busy = {};
  lay.tables.forEach(t => busy[t.id] = []);
  const free = (ids, a, b) => ids.every(id => busy[id].every(([x, y]) => b <= x || a >= y));
  const lastSeat = st.end - 75;
  for (let t = st.start; t <= lastSeat; t += 15) {
    const k = lerpCurve(st.curve, (t - st.start) / 60);
    const lambda = k * nonBar * 15 / 85 * st.resFrac * 1.25;
    const n = rng.poisson(lambda);
    for (let i = 0; i < n; i++) {
      const size = rng.weighted(st.sizes);
      const turn = S().turn[sizeBucket(size)] * st.turnMul;
      const cands = units.filter(u => u.max >= size && u.min <= size && free(u.ids, t, t + turn + 10));
      if (!cands.length) continue;
      cands.forEach(u => u._s = (u.max - size) * 10 + (u.ids.length - 1) * 8 + rng.r() * 4);
      cands.sort((a, b) => a._s - b._s);
      const u = cands[0];
      u.ids.forEach(id => busy[id].push([t, t + turn + 10]));
      out.push({ size, time: t, ids: u.ids.slice() });
    }
  }
  return out;
}

function makeResParty(b, st, rng, lay) {
  const tags = [];
  if (rng.chance(0.04)) tags.push('vip'); else if (rng.chance(0.09)) tags.push('regular');
  if (rng.chance(0.06)) tags.push('birthday'); else if (rng.chance(0.04)) tags.push('anniv');
  if (rng.chance(0.06)) tags.push('allergy');
  if (b.size >= 3 && rng.chance(SH.type === 'brunch' ? 0.18 : 0.05)) tags.push('highchair');
  const p = newParty({ kind: 'res', name: partyName(rng), size: b.size, origSize: b.size, resTime: b.time, assigned: b.ids, status: 'booked', tags });
  const h = p.hidden;
  h.noShow = rng.chance(st.noShow);
  const r = rng.r();
  if (r < 0.08) h.offset = -rng.range(16, 32);
  else if (r < 0.2) { h.offset = rng.range(17, 36); h.callsLate = rng.chance(0.5); }
  else h.offset = clamp(rng.normal(-2, 5), -12, 12);
  p.arriveTime = p.resTime + h.offset;
  h.patience = rng.range(28, 45);
  if (rng.chance(0.07)) h.sizeDelta = (b.size >= 4 && rng.chance(0.4)) ? -rng.int(1, 2) : rng.int(1, 2);
  if (tags.includes('vip') || tags.includes('regular')) {
    if (rng.chance(0.65)) {
      const cands = lay.tables.filter(t => t.shape !== 'bar' && t.max >= b.size && t.min <= b.size);
      if (cands.length) h.wantsTable = rng.pick(cands).id;
    }
  }
  if (rng.chance(0.05)) h.camp = rng.range(20, 32);
  if (rng.chance(0.08)) h.wantsMove = true;
  if (tags.includes('allergy')) p.note = rng.pick(['Shellfish allergy', 'Nut allergy', 'Gluten free', 'Dairy free']);
  else if (tags.includes('birthday')) p.note = 'Celebrating a birthday. Candle on dessert.';
  else if (tags.includes('anniv')) p.note = 'Anniversary. Quiet table if possible.';
  return p;
}

function buildWalkins(lay, st, rng) {
  const out = [];
  const nonBar = lay.tables.filter(t => t.shape !== 'bar').length || 1;
  const sizes = [[1, 12], [2, 46], [3, 14], [4, 18], [5, 5], [6, 4], [7, 1]];
  for (let t = st.start; t < st.end - 60; t += 5) {
    const k = lerpCurve(st.curve, (t - st.start) / 60);
    const n = rng.poisson(k * nonBar * 5 / 90 * st.walkFrac * 0.85);
    for (let i = 0; i < n; i++) out.push({ t: t + rng.range(0, 5), size: rng.weighted(sizes) });
  }
  out.sort((a, b) => a.t - b.t);
  return out;
}

function walkinHidden(rng, size, bigQuoteOk) {
  return {
    tolerance: size >= 6 ? rng.range(30, 70) : rng.range(18, 55) + (bigQuoteOk ? 15 : 0),
    patience: rng.range(8, 20),
    camp: rng.chance(0.05) ? rng.range(20, 32) : 0,
    wantsMove: rng.chance(0.06),
  };
}

function startShift(type, layoutId, opts = {}) {
  const lay = deepCopy(DB.layouts.find(l => l.id === layoutId) || activeLayout());
  const st = SHIFT_TYPES[type];
  const seed = opts.seed || (Date.now() & 0x7fffffff);
  const rng = makeRng(seed);
  RNG = makeRng(seed ^ 0x5bd1e995);
  SH = {
    id: uid('sh'), type, seed, layout: lay, startMin: st.start, endMin: st.end, clock: st.start - 10, speed: 0, prevSpeed: 5,
    parties: {}, order: [], tables: {}, walkQueue: [], msgs: [], breaks: {}, kitchen: null, ended: false, startedAt: Date.now(),
    stats: { seatMin: 0, capMin: 0, occMin: 0, warn: {}, overrides: [], curve: [], manualClears: 0, seatings: [], warnShown: 0, goals: [] },
    nextCb: st.start + 20, cbCount: {}, tutorial: null, lastToastMin: 0, venue: S().venue,
  };
  lay.tables.forEach(t => SH.tables[t.id] = { state: 'free', pid: null, since: SH.clock });
  if (type === 'tutorial') { setupTutorialShift(rng); return SH; }
  for (const b of buildBook(lay, st, rng)) addParty(makeResParty(b, st, rng, lay));
  SH.order.sort((a, b) => SH.parties[a].resTime - SH.parties[b].resTime);
  SH.walkQueue = buildWalkins(lay, st, rng);
  // a couple of guests already seated when the shift opens makes the floor feel live on busy shifts
  return SH;
}

/* ----- messages (curveballs) ----- */
function pushMsg(m) {
  m.id = uid('m'); m.at = SH.clock;
  SH.msgs.push(m);
  if (S().pauseOnAlert && SH.speed > 0) { SH.prevSpeed = SH.speed; SH.speed = 0; SH.pausedForMsg = true; }
  dirty('msg');
  return m;
}
function recordCurve(type, title, result, note) {
  const e = { type, title, result, note: note || '', at: SH.clock };
  SH.stats.curve.push(e); return SH.stats.curve.length - 1;
}
function addGoal(kind, pid, idx, deadline, extra = {}) {
  SH.stats.goals.push(Object.assign({ kind, pid, idx, deadline, done: false }, extra));
}

/* ----- the simulation step ----- */
function simStep(dt) {
  const st = SHIFT_TYPES[SH.type];
  const prev = SH.clock;
  SH.clock += dt;
  const now = SH.clock;
  const tut = SH.type === 'tutorial';

  // arrivals of reservations
  for (const p of allParties()) {
    if (p.kind !== 'res') continue;
    if (p.status === 'booked' && !p.hidden.noShow && p.arriveTime != null && now >= p.arriveTime && !p.flags.holdArrival) {
      arrive(p);
    } else if (p.status === 'noshow' && !p.hidden.noShow && !p.flags.cameBack && now >= p.arriveTime) {
      // marked no-show too early: they walk in anyway
      p.flags.cameBack = true; p.status = 'arrived'; p.arrivedAt = now;
      const e = SH.stats.curve[p.flags.noshowIdx];
      if (e) { e.result = 'poor'; e.note = 'They showed up after you marked them a no-show.'; }
      toast(`${shortName(p)} (${p.size}) just arrived. You'd marked them a no-show.`, 'warn');
    }
    // late with no call: prompt
    if (p.status === 'booked' && !p.flags.lateAsked && now >= (p.flags.nextLateAsk || p.resTime + S().lateGrace) && !tut) {
      p.flags.lateAsked = true;
      CB.late.create(p);
    }
    // calls ahead when running late
    if (p.status === 'booked' && p.hidden.callsLate && !p.flags.called && now >= p.resTime - 10) {
      p.flags.called = true; CB.callLate.create(p);
    }
  }

  // walk-ins at the door
  while (SH.walkQueue.length && SH.walkQueue[0].t <= now) {
    const w = SH.walkQueue.shift();
    if (now > SH.endMin - 45) continue;
    const p = addParty(newParty({ kind: 'walk', name: partyName(RNG), size: w.size, origSize: w.size, status: 'new', addedAt: now, hidden: walkinHidden(RNG, w.size, SH.type === 'holiday') }));
    toast(`Walk-in: ${shortName(p)}, party of ${p.size}, is at the stand.`, 'info', { act: 'open-party', id: p.id });
  }

  // patience
  for (const p of allParties()) {
    if (p.status === 'new' && now - p.addedAt > 7 && !p.flags.noLeave) {
      leave(p, 'walked', 'Nobody greeted or quoted them.');
    } else if (p.status === 'waiting') {
      const limit = p.quote + (p.quote === 0 ? 12 : Math.max(p.hidden.patience || 12, p.quote * 0.35));
      const waited = now - p.addedAt;
      if (!p.flags.overQuote && waited > p.quote + 2 && p.quote >= 0) { p.flags.overQuote = true; toast(`${shortName(p)} (${p.size}) has waited past their ${p.quote}-min quote.`, 'warn', { act: 'open-party', id: p.id }); }
      if (waited > limit && !p.flags.noLeave) leave(p, 'walked', `Waited ${Math.round(waited)} min on a ${p.quote}-min quote.`);
    } else if (p.status === 'arrived' && p.kind === 'res') {
      const w = now - partyWaitStart(p);
      if (!p.flags.warned && w > 15) { p.flags.warned = true; toast(`${shortName(p)} (${p.size}, ${fmtTime(p.resTime)}) has been waiting ${Math.round(w)} min.`, 'warn', { act: 'open-party', id: p.id }); }
      if (w > (p.hidden.patience || 40) && !p.flags.noLeave) leave(p, 'walked', `Reservation waited ${Math.round(w)} min without a table.`);
    }
  }

  // seated parties progress through courses
  for (const p of allParties()) {
    if (p.status !== 'seated') continue;
    let guard = 0;
    while (p.status === 'seated' && now >= p.phaseEnd && guard++ < 8) {
      const i = PHASES.indexOf(p.phase);
      if (i >= PHASES.length - 1) { depart(p); break; }
      p.phase = PHASES[i + 1];
      p.phaseEnd = p.phaseEnd + phaseDur(p, p.phase);
      if (p.phase === 'paid' && p.hidden.camp && !tut) p.flags.campFrom = now;
    }
    if (p.status === 'seated' && p.phase === 'paid' && p.flags.campFrom && !p.flags.campAsked && now - p.flags.campFrom > 14) {
      p.flags.campAsked = true;
      if (waitingParties().length) CB.camp.create(p); else p.hidden.camp = 0, p.phaseEnd = Math.min(p.phaseEnd, now + 4);
    }
  }

  // bussers
  const ab = S().autoBus;
  if (ab > 0 && !tut) for (const t of SH.layout.tables) {
    const s = SH.tables[t.id];
    if (s.state === 'clearing' && now - s.since >= ab) { s.state = 'free'; s.pid = null; s.since = now; }
  }

  // goals that resolve a curveball result later
  for (const g of SH.stats.goals) {
    if (g.done) continue;
    const p = P(g.pid); const e = SH.stats.curve[g.idx];
    if (!p || !e) { g.done = true; continue; }
    let ok = false;
    if (g.kind === 'moved') ok = p.tableIds.join() !== g.from;
    if (g.kind === 'pref') ok = p.status === 'seated' && p.tableIds.includes(g.tid);
    if (ok) { g.done = true; e.result = 'good'; continue; }
    if (now > g.deadline || ['walked', 'done', 'noshow', 'cancelled'].includes(p.status)) {
      g.done = true;
      if (g.kind === 'pref' && p.status === 'seated') { e.result = 'ok'; e.note = 'Seated, but not at the table they asked for.'; }
      else if (e.result === 'pending') { e.result = 'poor'; e.note = g.kind === 'moved' ? "They asked to move and weren't moved." : (e.note || 'Not followed through.'); }
    }
  }

  // stats: seat efficiency
  for (const p of allParties()) {
    if (p.status !== 'seated') continue;
    const cap = capacityOf(SH.layout, p.tableIds);
    SH.stats.seatMin += Math.min(p.size, cap.max) * dt;
    SH.stats.capMin += Math.max(cap.max, p.size) * dt;
  }
  SH.stats.occMin += occupancy() * dt;

  // random curveballs
  if (!tut && now >= SH.nextCb && now < SH.endMin - 30) {
    const freq = { low: 0.55, normal: 1, high: 1.7 }[S().curveballs] || 1;
    const gap = 40 / (st.cbRate * freq);
    SH.nextCb = now + RNG.range(gap * 0.5, gap * 1.4);
    fireRandomCurveball();
  }

  // shift over prompt
  if (prev < SH.endMin && now >= SH.endMin) toast('Last seating window has passed. End the shift whenever the room winds down.', 'info');
  if (Math.floor(prev) !== Math.floor(now)) dirty('min');
}

function arrive(p) {
  p.status = 'arrived'; p.arrivedAt = SH.clock;
  const early = p.resTime - SH.clock;
  if (p.hidden.sizeDelta && !p.flags.sizeDone && SH.type !== 'tutorial') { p.flags.sizeDone = true; CB.size.create(p, p.hidden.sizeDelta); }
  else if (p.hidden.wantsTable && !p.flags.prefAsked && SH.type !== 'tutorial') { p.flags.prefAsked = true; CB.pref.create(p); }
  else if (early >= 15 && SH.type !== 'tutorial') CB.early.create(p, early);
  else toast(`${shortName(p)} (${p.size}, ${fmtTime(p.resTime)}) checked in.`, 'info', { act: 'open-party', id: p.id });
  dirty('arrive');
}

function leave(p, status, why) {
  p.status = status; p.leftAt = SH.clock; p.outcome = why;
  toast(`${shortName(p)} (${p.size}) left. ${why}`, 'bad');
  if (selection && selection.pid === p.id) clearSelection();
  dirty('leave');
}

function depart(p) {
  p.status = 'done'; p.leftAt = SH.clock; p.phase = 'paid';
  for (const id of p.tableIds) { const s = SH.tables[id]; if (s && s.pid === p.id) { s.state = 'clearing'; s.pid = null; s.since = SH.clock; } }
  dirty('depart');
}

/* ----- curveball catalogue ----- */
const CB = {
  late: {
    create(p) {
      pushMsg({ type: 'late', pid: p.id, icon: 'clock', title: `${shortName(p)} is ${Math.round(SH.clock - p.resTime)} minutes late`,

      const p = P(m.pid); if (!p) return;

      } else if (k === 'noshow') {

        markNoShow(p, true);
      } else {
        recordCurve('late', `Late: ${shortName(p)}`, p.hidden.noShow ? 'ok' : 'good', 'Held the table.');
        p.flags.lateAsked = false; p.flags.nextLateAsk = SH.clock + 10;
      }
    },
  },
  late2: { resolve(m, k) { return CB.late.resolve(Object.assign({}, m, { _second: true }), k); } },
  callLate: {
    create(p) {

      pushMsg({ type: 'callLate', pid: p.id, icon: 'phone', title: `${shortName(p)} called: running ${mins} min late`,

      } else {

  early: {

      const opts = seated

        : [{ k: 'seat', label: 'Update size and pick a table', primary: true }, { k: 'update', label: 'Just update the size' }];

        else { const i = recordCurve('size', `Size change: ${shortName(p)}`, n > cap.max ? 'pending' : 'ok', n > cap.max ? '' : 'They fit already. Moving was extra work.'); if (n > cap.max) addGoal('moved', p.id, i, SH.clock + 15, { from: p.tableIds.join() }); if (k === 'move') beginMove(p.id); else beginAddTable(p.id); }
      } else {

        if (k === 'seat') beginSeat(p.id);
      }
      dirty('size');
    },
  },
  pref: {
    create(p) {
      const tid = p.hidden.wantsTable; const t = tableById(SH.layout, tid);
      const tag = p.tags.includes('vip') ? 'VIP' : 'regular';
